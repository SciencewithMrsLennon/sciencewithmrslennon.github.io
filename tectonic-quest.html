<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tectonic Quest: Rise of the Magma King</title>
<style>
:root{--ink:#fff6e8;--muted:#d9c6ad;--accent:#ff7a3d;--good:#2fd47a;--bad:#ff4d5e;--gold:#ffd166;--panel:#211915;--line:#5a3b2c}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(circle at 50% -10%,#3a2016,#0b0605 70%);color:var(--ink);font-family:"Trebuchet MS",Verdana,system-ui,sans-serif;min-height:100vh}
#app{max-width:1000px;margin:0 auto;padding:10px}
#hud{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#1c1411;border:3px solid #3e2a20;border-radius:14px;padding:8px 12px;margin-bottom:8px}
#hud .reg{flex:1 1 200px;min-width:180px}
#hud .reg b{font-size:18px;display:block;letter-spacing:.5px}
#hud .reg span{font-size:12px;color:var(--muted)}
.bar{width:130px;height:14px;background:#000;border:2px solid #555;border-radius:8px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(#5dff9d,#1fae5a);transition:width .3s}
.bar.xp>i{background:linear-gradient(#ffe38a,#e0a100)}
.stat{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.stat b{color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:4px 8px;border-radius:20px;background:#2e221d;border:2px solid #4a3529;color:var(--muted);white-space:nowrap}
.chip.done{background:#163b26;border-color:#2fd47a;color:#c9ffe0}
.crys{display:flex;gap:3px}
.crys i{width:14px;height:18px;clip-path:polygon(50% 0,100% 35%,50% 100%,0 35%);background:#3a2c26;display:block}
.hbtn{background:#2e221d;border:2px solid #5a3b2c;color:var(--ink);border-radius:10px;padding:6px 10px;font-size:15px;cursor:pointer}
.hbtn:hover{background:#3d2c25}
#stage{position:relative;border:4px solid #3e2a20;border-radius:14px;overflow:hidden;background:#000;box-shadow:0 10px 40px #000}
canvas{display:block;width:100%;height:auto}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(20,12,9,.92);border:2px solid var(--gold);color:var(--ink);padding:8px 16px;border-radius:12px;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1}
#dpad{display:none;justify-content:center;gap:40px;margin-top:10px;user-select:none;-webkit-user-select:none;touch-action:none}
#dpad .pad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:4px}
#dpad button{background:#2e221d;border:3px solid #5a3b2c;color:#fff;border-radius:12px;font-size:24px;touch-action:none}
#dpad button:active{background:#5a3b2c}
#tip{font-size:13px;color:var(--muted);text-align:center;margin-top:8px}
#overlay{position:fixed;inset:0;background:rgba(6,3,2,.8);display:flex;align-items:flex-start;justify-content:center;overflow:auto;z-index:50;padding:14px}
#overlay.hidden{display:none}
#panel{background:linear-gradient(#2a1f1a,#1a1210);border:4px solid var(--line);border-radius:18px;max-width:900px;width:100%;padding:20px 22px;box-shadow:0 20px 60px #000;margin:auto;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
h2{margin:0 0 8px;font-size:24px;color:var(--gold)}
h3{margin:6px 0;font-size:19px}
p{line-height:1.5}
.btn{background:linear-gradient(#ff9a52,#e2571c);border:none;border-bottom:5px solid #9b3510;color:#fff;font-weight:bold;font-size:18px;padding:11px 22px;border-radius:12px;cursor:pointer;font-family:inherit;letter-spacing:.5px}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(3px);border-bottom-width:2px}
.btn.alt{background:linear-gradient(#5f7cff,#3550d6);border-bottom-color:#1f2f8a}
.btn.green{background:linear-gradient(#41e08b,#16a457);border-bottom-color:#0b6a36}
.btn:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.center{text-align:center}
/* title */
.logo{font-size:52px;font-weight:900;letter-spacing:3px;background:linear-gradient(#ffe08a,#ff7a3d 55%,#c8261b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #3a0f06);line-height:1.05}
.subt{font-size:22px;color:#ffb38a;font-weight:bold;letter-spacing:2px}
.teks{display:inline-block;margin:10px 0;padding:5px 12px;border:2px solid var(--gold);border-radius:20px;color:var(--gold);font-size:14px}
input[type=text]{font-size:20px;padding:10px 14px;border-radius:10px;border:3px solid var(--line);background:#120c0a;color:#fff;width:280px;font-family:inherit}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:16px;text-align:left}
.howto div{background:#1a1310;border:2px solid #3e2a20;border-radius:12px;padding:10px;font-size:14px;color:var(--muted)}
.howto b{color:var(--ink)}
/* dialogue */
.dlg{display:flex;gap:16px;align-items:flex-start}
.portrait{flex:0 0 120px;text-align:center;font-size:13px;color:var(--gold);font-weight:bold}
.bubble{flex:1;background:#fff8ec;color:#2a1a12;border-radius:16px;padding:14px 18px;position:relative;font-size:17px;line-height:1.55}
.bubble h3{color:#b8401a;margin-top:0}
.bubble b{color:#7a2408}
.bubble table{border-collapse:collapse;width:100%;font-size:14px;margin-top:6px}
.bubble td,.bubble th{border:1px solid #c9a98a;padding:5px 7px;text-align:left;vertical-align:top}
.bubble th{background:#f3d9bd}
.tipbox{background:#fff0c2;border-left:6px solid #e0a100;padding:8px 12px;border-radius:8px;margin-top:8px;font-size:15px}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.dots i{width:10px;height:10px;border-radius:50%;background:#4a3529}
.dots i.on{background:var(--gold)}
/* battle */
.arena{border-radius:14px;padding:12px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;min-height:200px;position:relative;overflow:hidden}
.fighter{font-size:14px}
.fighter b{font-size:17px;display:block;margin-bottom:4px}
.foe{text-align:right}
.foe .bar{margin-left:auto}
.bar.foehp>i{background:linear-gradient(#ff8a8a,#d62839)}
.mon{animation:bob 1.6s ease-in-out infinite;filter:drop-shadow(0 8px 8px rgba(0,0,0,.5))}
@keyframes bob{50%{transform:translateY(-8px)}}
.mon.hit{animation:hit .45s}
@keyframes hit{0%,100%{transform:none;filter:none}20%{transform:translateX(-14px) rotate(-6deg);filter:brightness(3)}50%{transform:translateX(12px) rotate(5deg)}70%{transform:translateX(-6px)}}
.shake{animation:shk .4s}
@keyframes shk{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.dmg{position:absolute;font-weight:900;font-size:34px;color:#ffe066;text-shadow:0 3px 0 #000;animation:fly 1s forwards;pointer-events:none}
@keyframes fly{to{transform:translateY(-60px);opacity:0}}
.flash{position:absolute;inset:0;background:#ff2e2e;opacity:0;pointer-events:none;animation:fl .5s}
@keyframes fl{30%{opacity:.45}}
.qcard{background:#fffaf1;color:#24170f;border-radius:14px;padding:14px 16px;margin-top:12px}
.qmeta{display:flex;justify-content:space-between;font-size:13px;font-weight:bold;color:#9a4a1e;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;gap:8px;flex-wrap:wrap}
.qtext{font-size:18px;line-height:1.5}
.qtext table{border-collapse:collapse;margin:8px 0;font-size:15px}
.qtext td,.qtext th{border:1.5px solid #9c7b5c;padding:5px 10px;text-align:center}
.qtext th{background:#f1dcc3}
.diag{margin:8px 0;text-align:center}
.diag svg{max-width:100%;height:auto;border-radius:10px;border:2px solid #9c7b5c}
.choices{display:grid;gap:8px;margin-top:10px}
.choice{display:flex;gap:10px;align-items:flex-start;text-align:left;background:#fff;border:3px solid #d8c2a8;border-radius:12px;padding:10px 12px;font-size:16px;cursor:pointer;color:#24170f;font-family:inherit;line-height:1.4}
.choice:hover:not(:disabled){border-color:#ff7a3d;background:#fff4e8}
.choice .lt{flex:0 0 28px;height:28px;border-radius:50%;background:#3b2a22;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold}
.choice.picked{border-color:#3550d6;background:#eef1ff}
.choice.correct{border-color:#16a457;background:#dcffe9}
.choice.wrong{border-color:#d62839;background:#ffe1e4}
.choice.gone{opacity:.25;text-decoration:line-through}
.choice:disabled{cursor:default}
.fb{margin-top:10px;padding:12px 14px;border-radius:12px;font-size:16px;line-height:1.5;display:none}
.fb.good{display:block;background:#dcffe9;border:2px solid #16a457}
.fb.bad{display:block;background:#ffe9eb;border:2px solid #d62839}
.fb b.h{font-size:19px;display:block;margin-bottom:3px}
.qact{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:10px;flex-wrap:wrap}
.scan{background:#2b3a66;color:#fff;border:none;border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer;font-family:inherit}
.scan:disabled{opacity:.4;cursor:default}
.streak{font-size:14px;font-weight:bold;color:#ff7a3d}
/* stations */
.ins{color:var(--muted);margin:2px 0 10px}
.bins{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.bin{background:#14100e;border:3px dashed #6b4a37;border-radius:14px;min-height:120px;padding:8px;cursor:pointer;transition:background .2s}
.bin:hover{background:#21170f}
.binh{font-weight:bold;color:var(--gold);text-align:center;margin-bottom:6px;font-size:16px}
.binc{display:flex;flex-wrap:wrap;gap:6px}
.cards{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;justify-content:center}
.card{background:#fff6e6;color:#2a1a12;border:3px solid #d8b994;border-radius:10px;padding:8px 10px;font-size:15px;cursor:pointer;font-family:inherit;max-width:260px}
.card.sel{border-color:#ff7a3d;box-shadow:0 0 0 4px rgba(255,122,61,.4);transform:translateY(-3px)}
.card.placed{font-size:13px;padding:5px 8px;cursor:default;background:#dcffe9;border-color:#16a457}
.msg{min-height:26px;text-align:center;margin-top:10px;font-weight:bold;color:var(--gold)}
.slots{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.slot{background:#14100e;border:2px dashed #6b4a37;border-radius:10px;padding:8px 12px;min-height:44px;display:flex;gap:10px;align-items:center}
.slot .n{flex:0 0 30px;height:30px;border-radius:50%;background:#5a3b2c;display:flex;align-items:center;justify-content:center;font-weight:bold}
.slot.fill{border-style:solid;border-color:#16a457;background:#123122}
.ocards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.ocard{background:#fff6e6;color:#2a1a12;border:3px solid #d8b994;border-radius:12px;padding:8px;font-size:14px;cursor:pointer;font-family:inherit;text-align:center}
.ocard svg{width:100%;height:auto;display:block;margin-bottom:4px;border-radius:8px}
.ocard.used{visibility:hidden}
.labctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:10px 0}
.labctl div{background:#14100e;border:2px solid #4a3529;border-radius:12px;padding:8px}
.labctl b{display:block;color:var(--gold);margin-bottom:6px;font-size:14px}
.tog{display:inline-block;margin:3px;padding:7px 10px;border-radius:10px;border:2px solid #6b4a37;background:#2a1f1a;color:#fff;cursor:pointer;font-family:inherit;font-size:14px}
.tog.on{background:#ff7a3d;border-color:#ffb38a}
.labview{background:#0e0a09;border-radius:14px;padding:6px;text-align:center}
.labview svg{max-width:100%;height:auto}
.result{background:#fff8ec;color:#2a1a12;border-radius:12px;padding:10px 14px;margin-top:8px;font-size:15px;line-height:1.5;min-height:60px}
.disc{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.disc span{font-size:13px;padding:5px 9px;border-radius:20px;border:2px solid #4a3529;color:var(--muted)}
.disc span.got{border-color:#2fd47a;color:#c9ffe0;background:#163b26}
.slideL{animation:slL 1.1s ease-out both}
.slideR{animation:slR 1.1s ease-out both}
.apartL{animation:apL 1.1s ease-out both}
.apartR{animation:apR 1.1s ease-out both}
.upS{animation:upS 1.1s ease-out both}
.dnS{animation:dnS 1.1s ease-out both}
@keyframes slL{from{transform:translateX(-45px)}}
@keyframes slR{from{transform:translateX(45px)}}
@keyframes apL{from{transform:translateX(30px)}}
@keyframes apR{from{transform:translateX(-30px)}}
@keyframes upS{from{transform:translateY(40px)}}
@keyframes dnS{from{transform:translateY(-40px)}}
.popin{animation:popin .6s 1s both}
@keyframes popin{from{opacity:0;transform:scale(.6)}}
.glow{animation:glw 1.2s ease-in-out infinite}
@keyframes glw{50%{opacity:.55}}
input[type=range]{width:100%;accent-color:#ff7a3d;height:30px}
.journal .reg{border:2px solid #3e2a20;border-radius:14px;padding:10px 14px;margin:10px 0;background:#1a1310}
.journal .page{background:#fff8ec;color:#2a1a12;border-radius:12px;padding:10px 14px;margin:8px 0;font-size:15px;line-height:1.5}
.journal .page h4{margin:0 0 4px;color:#b8401a;font-size:17px}
.journal .page table{border-collapse:collapse;width:100%;font-size:13px}
.journal .page td,.journal .page th{border:1px solid #c9a98a;padding:4px 6px;text-align:left}
.locked{color:var(--muted);font-style:italic}
.cert{background:linear-gradient(#fff8e6,#ffe9c4);color:#2a1a12;border:8px double #b8401a;border-radius:16px;padding:22px;text-align:center}
.cert h1{margin:4px 0;color:#b8401a;font-size:34px}
.cert .nm{font-size:36px;font-weight:900;border-bottom:3px solid #b8401a;display:inline-block;padding:0 20px;margin:8px 0}
.cert table{margin:10px auto;border-collapse:collapse;font-size:16px}
.cert td{padding:5px 14px;border-bottom:1px solid #d9b98f;text-align:left}
.codes{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.codes span{background:#2a1a12;color:#ffd166;font-weight:bold;letter-spacing:2px;padding:6px 10px;border-radius:8px;font-family:monospace;font-size:16px}
.bigcode{font-family:monospace;font-size:40px;letter-spacing:6px;color:var(--gold);background:#120c0a;border:3px solid var(--gold);display:inline-block;padding:8px 22px;border-radius:12px;margin:10px 0}
@media (max-width:640px){.logo{font-size:34px}.dlg{flex-direction:column;align-items:center}.portrait{flex:0 0 auto}.arena{grid-template-columns:1fr 1fr}.arena .mid{grid-column:1/3;grid-row:1;text-align:center}}
@media print{body{background:#fff}#app{display:none}#overlay{position:static;background:none}#panel{border:none;box-shadow:none}.noprint{display:none}}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="reg"><b id="hName">Tectonic Quest</b><span id="hSub">TEKS 7.10B</span></div>
    <div class="stat">HP <div class="bar"><i id="hHp" style="width:100%"></i></div></div>
    <div class="stat"><span>LVL <b id="hLvl">1</b></span><div class="bar xp"><i id="hXp" style="width:0%"></i></div></div>
    <div class="chips" id="hChips"></div>
    <div class="crys" id="hCrys" title="Tectonic Crystals"></div>
    <button class="hbtn" id="bJournal" title="Field Journal">📓 Journal</button>
    <button class="hbtn" id="bSound" title="Sound">🔊</button>
    <button class="hbtn" id="bHelp" title="How to play">❓</button>
  </div>
  <div id="stage"><canvas id="cv" width="960" height="560"></canvas><div id="toast"></div></div>
  <div id="dpad">
    <div class="pad">
      <span></span><button data-k="u">▲</button><span></span>
      <button data-k="l">◀</button><span></span><button data-k="r">▶</button>
      <span></span><button data-k="d">▼</button><span></span>
    </div>
  </div>
  <div id="tip">Move with <b>Arrow keys</b> or <b>WASD</b>. Walk into people 🧑‍🔬, lab stations 🖥️, chests 🎁 and monsters 👾.</div>
</div>
<div id="overlay" class="hidden"><div id="panel"></div></div>

<script>
"use strict";
/* ================= CONTENT ================= */
const TILE=40, COLS=24, ROWS=14;

const ROOMS=[
{ key:"core", name:"Core Caverns", sub:"Earth’s layers · crust · convection currents", code:"MANTLE", crystal:"#ff5a36",
  theme:{floor:"#3a2622",floor2:"#3f2a25",speck:"#4f362f",wall:"#1a100e",wallTop:"#5c3a30",deco:"spike",decoC:"#8a5a44",mtn:"#6b4a3a",cap:"#ff6a2b",arena:"linear-gradient(#5a2a1a,#1d0d08)"},
  guide:{name:"Dr. Terra",coat:"#f5f5f5",shirt:"#d9472b",hair:"#5a3a22",skin:"#c98b5e"},
  foes:[["Magma Mite","#ff6a3d"],["Basalt Beetle","#6c7a89"],["Mantle Mole","#c0703a"]],
  map:[
"########################",
"#......#.......ll......#",
"#..G...#...E...ll...C..#",
"#......#.......ll......#",
"#......#...............#",
"#..t.......t......t....#",
"#P......lll.........S..>",
"#.......lll............>",
"#..t...............t...#",
"#......E....##.........#",
"#...........##...ll..E.#",
"#..ll.....t......ll....#",
"#..ll..................#",
"########################"],
  lesson:[
   {h:"Welcome, Geo Ranger!",b:"I’m <b>Dr. Terra</b>. The <b>Magma King</b> shattered the 5 Tectonic Crystals and is shaking our planet apart! To stop him, you must master <b>how plate tectonics shapes Earth</b>.<div class='tipbox'>📓 Every page I show you is saved in your <b>Field Journal</b>. Open it anytime with the Journal button — it is your secret weapon in battles!</div>"},
   {h:"Earth’s Layers & Plates",b:"Earth has four main layers: <b>crust, mantle, outer core, inner core</b>.<br>• The <b>lithosphere</b> = the crust + the rigid top of the mantle. It is broken into giant pieces called <b>tectonic plates</b>.<br>• The <b>asthenosphere</b> = the soft, slowly flowing layer of the upper mantle. The plates ride on top of it."},
   {h:"What Moves the Plates?",b:"<b>Convection currents</b> in the mantle:<br>1️⃣ Heat from deep inside Earth warms mantle rock at the bottom.<br>2️⃣ Hot rock becomes <b>less dense</b> and <b>rises</b>.<br>3️⃣ It spreads out under the plates, dragging them along.<br>4️⃣ It cools, becomes <b>denser</b>, and <b>sinks</b> — then the loop repeats.<br><br><b>Slab pull</b> helps too: a cold, dense plate sinking into the mantle pulls the rest of the plate behind it.<div class='tipbox'>Plates move only a few <b>centimeters per year</b> — about as fast as your fingernails grow. Over millions of years that adds up to thousands of kilometers!</div>"},
   {h:"Two Kinds of Crust",b:"<table><tr><th></th><th>Oceanic crust</th><th>Continental crust</th></tr><tr><td>Thickness</td><td><b>Thin</b> (5–10 km)</td><td><b>Thick</b> (30–70 km)</td></tr><tr><td>Density</td><td><b>More dense</b></td><td><b>Less dense</b></td></tr><tr><td>Rock</td><td>Basalt</td><td>Granite</td></tr><tr><td>Age</td><td>Young (under ~200 million yrs)</td><td>Can be billions of years old</td></tr></table><div class='tipbox'>⭐ <b>STAAR Tip:</b> Denser crust sinks. When oceanic crust meets continental crust, the <b>oceanic crust subducts</b> (sinks under). Oceanic crust gets recycled into the mantle, so it never gets very old.</div>"}
  ],
  qs:[
   {q:"A student models the mantle by heating a pot of thick soup. Soup near the burner rises, moves across the top, and sinks at the cooler edges. Why does the soup near the burner rise?",c:["It becomes less dense as it is heated","It becomes more dense as it is heated","The cooler soup on top pulls it upward","Gravity is weaker near the burner"],a:0,e:"Heated material expands and becomes <b>less dense</b>, so it rises. Mantle rock does the same thing — this is a <b>convection current</b>."},
   {q:"Tectonic plates move on top of which layer?",c:["Inner core","Outer core","Asthenosphere","Lithosphere"],a:2,e:"The plates <i>are</i> pieces of the <b>lithosphere</b>. They ride on the soft, slowly flowing <b>asthenosphere</b> in the upper mantle."},
   {q:"The table shows data for two samples of crust.<table><tr><th>Sample</th><th>Density (g/cm³)</th><th>Thickness (km)</th><th>Main rock</th></tr><tr><td>X</td><td>3.0</td><td>7</td><td>basalt</td></tr><tr><td>Y</td><td>2.7</td><td>35</td><td>granite</td></tr></table>If plates made of X and Y move toward each other, what will most likely happen?",c:["X will sink beneath Y because X is denser","Y will sink beneath X because Y is thicker","Both will be pushed up into folded mountains","The plates will slide past each other"],a:0,e:"Sample X is <b>oceanic crust</b> (thin, dense basalt). Sample Y is <b>continental crust</b>. The denser oceanic plate <b>subducts</b> under the continental plate."},
   {q:"Which statement correctly compares oceanic crust and continental crust?",c:["Oceanic crust is thinner and more dense","Oceanic crust is thicker and less dense","Continental crust is thinner and more dense","They have the same density but different thicknesses"],a:0,e:"Oceanic crust is <b>thin and dense</b> (basalt). Continental crust is <b>thick and less dense</b> (granite)."},
   {q:"Which TWO help move tectonic plates?",c:["Convection currents in the mantle","Slab pull from a dense plate sinking into the mantle","Wind blowing across the continents","Ocean waves pushing against coastlines","The Moon’s gravity dragging the crust"],a:[0,1],multi:true,e:"Plates are moved by <b>convection currents</b> in the mantle and by <b>slab pull</b> (a sinking, dense plate pulling the rest of the plate). Wind, waves and the Moon do not move plates."},
   {q:"A plate moves 5 centimeters per year. About how far will it move in 1 million years?<br><small>(1 km = 100,000 cm)</small>",c:["5 km","50 km","500 km","5,000 km"],a:1,e:"5 cm × 1,000,000 years = 5,000,000 cm. 5,000,000 ÷ 100,000 = <b>50 km</b>. Slow motion adds up over geologic time!"},
   {q:"In a mantle convection current, what happens to rock after it spreads out beneath the lithosphere?",c:["It cools, becomes denser, and sinks","It heats up and rises even faster","It turns into the outer core","It stops moving permanently"],a:0,e:"After spreading out under the plates, the rock <b>cools, becomes denser, and sinks</b>, completing the convection loop."},
   {q:"Which description best defines the lithosphere?",c:["The crust and the rigid top part of the mantle","The liquid layer of the outer core","The soft, flowing layer of the upper mantle","Only the crust under the oceans"],a:0,e:"The <b>lithosphere</b> = crust + rigid uppermost mantle. It is broken into tectonic plates."},
   {q:"What is the main source of the heat that drives convection currents in the mantle?",c:["Heat from Earth’s hot interior","Sunlight heating Earth’s surface","Warm ocean currents","Friction from wind on the continents"],a:0,e:"Convection is driven by heat from <b>Earth’s interior</b> (the core and deep mantle), not the Sun."},
   {q:"A student heats one end of a clear tank of water and adds a drop of food coloring above the heat. Which observation shows a convection current?",c:["The colored water rises, moves across the top, and sinks at the cool end","The colored water stays in one spot","The colored water sinks straight to the bottom above the heat","The colored water spreads evenly in all directions at once"],a:0,e:"A convection current is a <b>loop</b>: warm fluid rises, moves across, cools and sinks. Mantle rock moves in the same kind of loop — just very slowly."}
  ]},

  lesson:[
   {h:"Divergent Boundaries",b:"At a <b>divergent boundary</b>, plates move <b>APART</b> ⬅️ ➡️.<br>• Magma rises to fill the gap, cools, and forms <b>NEW crust</b>.<br>• You find <b>shallow earthquakes</b> and <b>volcanic activity</b> there."},
   {h:"How Ocean Basins Form",b:"<b>Ocean basin formation</b> happens in stages:<br>1️⃣ A continent stretches and cracks — a <b>rift</b> begins.<br>2️⃣ The land drops down into a <b>rift valley</b> (East African Rift).<br>3️⃣ The valley floods with ocean water → a <b>narrow sea</b> (Red Sea).<br>4️⃣ Spreading continues for millions of years → a <b>wide ocean basin</b> with a mid-ocean ridge (Atlantic Ocean)."},
   {h:"Seafloor Spreading",b:"Under the ocean, a divergent boundary forms a <b>mid-ocean ridge</b>, like the <b>Mid-Atlantic Ridge</b>.<br>• New rock forms at the ridge and is pushed outward in <b>both directions</b>.<br>• Rock is <b>youngest at the ridge</b> and gets <b>older farther away</b> — a mirror-image pattern on both sides.<br>• <b>Iceland</b> sits right on top of the Mid-Atlantic Ridge and is slowly being pulled apart."},
   {h:"STAAR Tip",b:"<div class='tipbox'>⭐ The <b>Atlantic Ocean is getting wider</b> — it has a spreading ridge down the middle and very few subduction zones.<br>⭐ The <b>Pacific Ocean is getting smaller</b> — it is surrounded by subduction zones (the Ring of Fire) where oceanic crust is destroyed.<br>⭐ Plates moving apart + magma rising + new crust = <b>DIVERGENT</b>.</div>"}
  ],
  qs:[
   {q:"Scientists measured the age of rock samples on both sides of the Mid-Atlantic Ridge.<table><tr><th>Location</th><th>Age of rock (million years)</th></tr><tr><td>200 km west</td><td>16</td></tr><tr><td>100 km west</td><td>8</td></tr><tr><td>At the ridge</td><td>0</td></tr><tr><td>100 km east</td><td>8</td></tr><tr><td>200 km east</td><td>16</td></tr></table>Which conclusion is best supported by the data?",c:["New oceanic crust forms at the ridge and moves away in both directions","Oceanic crust is destroyed at the ridge","The oldest rock is found at the ridge","The two plates are moving toward each other"],a:0,e:"Rock is <b>youngest at the ridge</b> and older with distance on <b>both sides</b>. That is evidence of <b>seafloor spreading</b> at a divergent boundary."},
   {q:"The East African Rift Valley is forming where plates are pulling apart. If the plates keep moving apart for millions of years, this area will most likely become —",c:["a narrow sea, and later a wide ocean basin","a tall range of folded mountains","a volcanic island arc","a deep-ocean trench"],a:0,e:"Rift valley → narrow sea (like the Red Sea) → wide ocean basin (like the Atlantic). This is <b>ocean basin formation</b>."},
   {q:"Which describes what happens at a divergent boundary?",c:["Plates move apart, magma rises, and new crust forms","Plates collide and one plate sinks into the mantle","Plates slide past each other and no crust is made","Plates crumple together to form tall mountains"],a:0,e:"Divergent = <b>apart</b>. Magma rises into the gap and cools to make <b>new crust</b>."},
   {q:"Iceland has many active volcanoes and is slowly getting wider. Which statement best explains this?",c:["Iceland sits on the Mid-Atlantic Ridge, where plates move apart and magma rises","Iceland sits where an oceanic plate subducts under a continent","Iceland sits on a transform boundary where plates slide past each other","Iceland is being squeezed between two colliding continents"],a:0,e:"Iceland is on the <b>Mid-Atlantic Ridge</b>, a <b>divergent boundary</b>. Plates pulling apart let magma rise, making volcanoes and widening the island."},
   {q:"Africa and South America are moving apart at about 3 cm per year. The Atlantic Ocean between them is about 4,500 km wide. About how long ago did the Atlantic begin to open?<br><small>(1 km = 100,000 cm)</small>",c:["1.5 million years ago","15 million years ago","150 million years ago","1.5 billion years ago"],a:2,e:"4,500 km = 450,000,000 cm. 450,000,000 ÷ 3 cm/yr = <b>150,000,000 years</b>. Ocean basins take a VERY long time to form."},
   {q:"Which TWO features form at divergent boundaries?",c:["Mid-ocean ridge","Rift valley","Deep-ocean trench","Volcanic island arc","Folded mountain range"],a:[0,1],multi:true,e:"<b>Mid-ocean ridges</b> (in oceans) and <b>rift valleys</b> (on land) form where plates move apart. Trenches and island arcs form at subduction zones; folded mountains form where continents collide."},
   {q:"The Atlantic Ocean is getting wider, but the Pacific Ocean is getting smaller. Which statement best explains this?",c:["The Atlantic has a spreading ridge and few subduction zones, while the Pacific is surrounded by subduction zones","The Atlantic has more water flowing into it from rivers","The Pacific is cooling and shrinking","The Atlantic has more hot spots than any other ocean"],a:0,e:"New crust forms at the <b>Mid-Atlantic Ridge</b>, and little is destroyed around the Atlantic. Around the Pacific, <b>subduction zones</b> (the Ring of Fire) destroy oceanic crust faster than it forms."},
   {q:"Which evidence best shows that new ocean floor forms at mid-ocean ridges?",c:["Rock is youngest at the ridge and gets older with distance on both sides","Ocean water is saltier near the ridge","The deepest water in the ocean is found at the ridge","Fossils of land animals are found on the ridge"],a:0,e:"The <b>mirror-image age pattern</b> — youngest at the ridge, older farther away — shows crust forms at the ridge and spreads outward."},
   {q:"The Red Sea, between Africa and the Arabian Peninsula, is slowly getting wider. What type of plate boundary runs through the Red Sea?",c:["Divergent","Convergent (oceanic–continental)","Convergent (continental–continental)","Transform"],a:0,e:"A sea that is widening means plates are moving <b>apart</b> — a <b>divergent</b> boundary. The Red Sea is the ‘narrow sea’ stage of ocean basin formation."},
   {q:"Why is the rock at a mid-ocean ridge younger than the rock near the edges of the ocean?",c:["Magma rises and cools at the ridge to form new rock, which then moves outward","Old rock is pulled up from the mantle at the ridge","Sediment builds up fastest at the ridge","Earthquakes at the ridge destroy old rock"],a:0,e:"At the ridge, <b>magma rises and cools into new crust</b>. As spreading continues, that crust is pushed outward, so rock farther away is older."}
  ]},

  lesson:[
   {h:"Convergent Boundaries",b:"At a <b>convergent boundary</b>, plates move <b>TOWARD</b> each other ➡️⬅️ and collide. What happens depends on the <b>type of crust</b> on each plate."},
   {h:"Oceanic vs. Continental",b:"The <b>denser oceanic plate subducts</b> (sinks) beneath the continental plate.<br>It forms:<br>• a <b>deep-ocean trench</b> offshore<br>• a chain of <b>volcanic mountains</b> on the continent<br>• strong earthquakes<br><b>Examples:</b> the <b>Andes Mountains</b> (Nazca plate under the South American plate) and the <b>Cascade Range</b> with Mount St. Helens."},
   {h:"Oceanic vs. Oceanic",b:"When two oceanic plates collide, the <b>older, colder, denser</b> plate subducts.<br>It forms:<br>• a <b>deep-ocean trench</b><br>• a curved chain of volcanic islands called an <b>island arc</b><br><b>Examples:</b> <b>Japan</b>, the <b>Aleutian Islands</b> of Alaska, and the <b>Mariana Trench</b> — the deepest place on Earth."},
   {h:"Why Subduction Makes Volcanoes",b:"As the subducting plate sinks into the hot mantle, it heats up and releases water. That makes the rock above it <b>melt into magma</b>. Magma is less dense, so it <b>rises</b> and erupts as volcanoes.<br>• Earthquakes get <b>deeper</b> the farther you go from the trench — they follow the sinking plate.<div class='tipbox'>⭐ The <b>Ring of Fire</b> is a ring of subduction zones around the Pacific Ocean. It has most of Earth’s volcanoes and earthquakes.<br>⭐ <b>Trench + volcanoes = SUBDUCTION.</b></div>"}
  ],
  qs:[
   {q:"The diagram shows two plates colliding. What forms at location <b>Y</b>, and why?",d:"subXY",c:["Volcanic mountains — the subducting plate melts and magma rises","A mid-ocean ridge — the plates are spreading apart","Folded mountains — neither plate can subduct","A rift valley — the crust is stretching"],a:0,e:"Location Y is on the continent above the sinking oceanic plate. Melting there makes <b>magma that rises</b> to form <b>volcanic mountains</b>."},
   {q:"In the diagram, what feature is located at <b>X</b>?",d:"subXY",c:["A deep-ocean trench","A mid-ocean ridge","A rift valley","A hot spot"],a:0,e:"X is where the oceanic plate bends down and begins to subduct — a <b>deep-ocean trench</b>."},
   {q:"The Andes Mountains along the west coast of South America have many active volcanoes. Which explanation is best?",c:["The oceanic Nazca plate subducts beneath the continental South American plate","Two continental plates are colliding and crumpling","The plates are moving apart and magma is filling the gap","The plates are sliding past each other"],a:0,e:"This is <b>oceanic–continental convergence</b>. The dense Nazca plate subducts, melts, and the magma rises to form the volcanic Andes."},
   {q:"When two oceanic plates collide, which plate usually subducts?",c:["The older, colder, denser plate","The younger, warmer plate","The plate that is moving faster","Neither — they form folded mountains"],a:0,e:"Oceanic crust gets <b>colder and denser as it ages</b>, so the <b>older plate sinks</b>."},
   {q:"Which pair of colliding plates would form a deep trench AND a chain of volcanic islands (an island arc)?",c:["Oceanic plate and oceanic plate","Oceanic plate and continental plate","Continental plate and continental plate","Two plates moving apart"],a:0,e:"<b>Oceanic–oceanic</b> convergence makes a trench + <b>island arc</b> (like Japan). Oceanic–continental makes volcanic mountains <b>on a continent</b> instead of islands."},
   {q:"A region has a deep-ocean trench, a chain of volcanoes, and strong earthquakes that get deeper farther from the trench. Which TWO statements are true about this region?",c:["An oceanic plate is subducting","Magma forms as the sinking plate heats up in the mantle","New crust is forming as plates move apart","The plates are sliding past each other horizontally","The region is in the middle of a plate over a hot spot"],a:[0,1],multi:true,e:"Trench + volcanoes + deepening earthquakes = <b>subduction</b>. The sinking plate heats up, rock above it melts, and the <b>magma rises</b> to form volcanoes."},
   {q:"Why do most of the world’s volcanoes and earthquakes occur around the edges of the Pacific Ocean?",c:["The Pacific is surrounded by subduction zones","The Pacific has the warmest water","The Pacific is in the middle of one plate","The Pacific has the most hot spots"],a:0,e:"The <b>Ring of Fire</b> is a ring of <b>subduction zones</b> around the Pacific. Subduction causes both volcanoes and powerful earthquakes."},
   {q:"Along a subduction zone, earthquakes are shallow near the trench and get deeper farther inland. What is the best explanation?",c:["The earthquakes happen along the sinking plate as it goes deeper into the mantle","Inland rock is softer, so earthquakes start deeper","Earthquakes always get deeper as you move away from oceans","Magma pushes the earthquakes downward"],a:0,e:"The earthquakes trace the <b>subducting plate</b>. As it slants down into the mantle, the quakes along it get deeper."},
   {q:"Mount St. Helens in Washington State erupted in 1980. Which process formed this volcano?",c:["The oceanic Juan de Fuca plate subducting under the North American plate","The North American plate moving over a hot spot","The Pacific and North American plates sliding past each other","Two continental plates colliding"],a:0,e:"The Cascade volcanoes, including Mount St. Helens, form where the <b>oceanic Juan de Fuca plate subducts</b> beneath North America."},
   {q:"Japan is a chain of volcanic islands next to a deep trench. Japan is best described as —",c:["a volcanic island arc formed where oceanic plates converge","a hot spot island chain","a mid-ocean ridge","a folded mountain range"],a:0,e:"Japan is an <b>island arc</b> — volcanic islands formed by <b>oceanic–oceanic subduction</b> next to a trench."}
  ]},

  lesson:[
   {h:"Continent vs. Continent",b:"Continental crust is too <b>thick and buoyant</b> to subduct. When two continents collide, the crust <b>crumples, folds, and is pushed up</b> into tall <b>folded mountains</b>.<br>• <b>Example:</b> India crashing into Asia built the <b>Himalayas</b> and <b>Mount Everest</b> — and they are still rising!<br>• Lots of <b>earthquakes</b>, but <b>few or no volcanoes</b> (no subduction = little magma).<br>• Marine fossils near the mountaintops = old seafloor that got pushed up."},
   {h:"Transform Boundaries",b:"At a <b>transform boundary</b>, plates <b>slide PAST</b> each other horizontally ⬆️⬇️.<br>• Crust is <b>neither created nor destroyed</b>.<br>• The rocks lock together, stress builds, then they suddenly slip → <b>EARTHQUAKES</b>.<br>• <b>No volcanoes.</b><br><b>Example:</b> the <b>San Andreas Fault</b> in California (Pacific plate & North American plate)."},
   {h:"Boundary Cheat Sheet",b:"<table><tr><th>Boundary</th><th>Motion</th><th>Crust</th><th>Features</th><th>Volcanoes?</th></tr><tr><td>Divergent</td><td>apart</td><td>created</td><td>mid-ocean ridge, rift valley</td><td>yes</td></tr><tr><td>Convergent (subduction)</td><td>together</td><td>destroyed</td><td>trench, volcanic mountains, island arcs</td><td>yes</td></tr><tr><td>Convergent (continent–continent)</td><td>together</td><td>crumpled & pushed up</td><td>folded mountains</td><td>rarely</td></tr><tr><td>Transform</td><td>slide past</td><td>neither</td><td>faults</td><td>no</td></tr></table>Earthquakes happen at <b>ALL</b> boundary types."},
   {h:"STAAR Detective Rules",b:"<div class='tipbox'>🔍 <b>Trench + volcanoes</b> → subduction (convergent)<br>🔍 <b>Tall mountains, no volcanoes</b> → continent–continent collision<br>🔍 <b>Earthquakes only, no volcanoes or mountains</b> → transform<br>🔍 <b>New crust, ridge or rift valley</b> → divergent</div>"}
  ],
  qs:[
   {q:"Fossils of sea creatures are found near the top of the Himalayas, and the range has very few volcanoes. Which statement best explains BOTH observations?",c:["Two continental plates collided, pushing up old seafloor rock without subduction","An oceanic plate subducted beneath a continent, forming volcanoes","The plates moved apart and the seafloor rose","A hot spot pushed the seafloor upward"],a:0,e:"When <b>India collided with Asia</b>, old seafloor sediment (with fossils) was folded and pushed up. Neither continent subducted, so <b>little magma formed — few volcanoes</b>."},
   {q:"Which statement describes the San Andreas Fault?",c:["Two plates slide past each other, and crust is neither created nor destroyed","Two plates move apart, and new crust forms","An oceanic plate sinks beneath a continental plate","Two continental plates collide and form mountains"],a:0,e:"The San Andreas is a <b>transform boundary</b> — plates slide past each other, so crust is <b>neither created nor destroyed</b>."},
   {q:"Why do transform boundaries usually NOT have volcanoes?",c:["No crust is being melted or pulled apart, so no magma rises","The crust there is too thick to erupt","Transform boundaries only occur under oceans","Earthquakes there block magma from rising"],a:0,e:"Volcanoes need <b>magma</b>. At transform boundaries there is no subduction (melting) and no spreading (gap to fill), so magma doesn’t rise."},
   {q:"The diagram shows two plates moving toward each other. What will most likely form where they meet?",d:"cc",c:["Tall folded mountains","A deep-ocean trench","A mid-ocean ridge","A volcanic island arc"],a:0,e:"Both plates are <b>continental</b>. Neither is dense enough to subduct, so the crust crumples and folds into <b>tall mountains</b>, like the Himalayas."},
   {q:"Which TWO types of plate boundaries can build mountains on land?",c:["Continental–continental convergent","Oceanic–continental convergent","Transform","A boundary where crust is neither created nor destroyed"],a:[0,1],multi:true,e:"<b>Continent–continent</b> collisions make folded mountains (Himalayas). <b>Oceanic–continental</b> subduction makes volcanic mountains (Andes). Transform boundaries don’t build mountain ranges."},
   {q:"Which statement about earthquakes is correct?",c:["Earthquakes can occur at all types of plate boundaries","Earthquakes only occur at transform boundaries","Earthquakes only occur where there are volcanoes","Earthquakes only occur at convergent boundaries"],a:0,e:"Earthquakes happen at <b>divergent, convergent, AND transform</b> boundaries — anywhere plates move against each other."},
   {q:"A map of one region shows many earthquakes along a long, straight line, but no volcanoes, no trench, and no mountain range forming. What type of boundary is most likely there?",c:["Transform","Divergent","Oceanic–continental convergent","Oceanic–oceanic convergent"],a:0,e:"Earthquakes with <b>no volcanoes, no trench, and no new mountains</b> = plates sliding past each other at a <b>transform</b> boundary."},
   {q:"The Indian plate is still moving north into the Eurasian plate at about 5 cm per year. What is most likely happening to Mount Everest?",c:["It is slowly getting taller as the collision continues","It is sinking into a trench","It is splitting apart into a rift valley","It is turning into a volcano"],a:0,e:"The <b>continental collision is still happening</b>, so the Himalayas — including Everest — are still being pushed up a few millimeters each year."},
   {q:"Along a transform fault, rocks stay locked together for years and then suddenly shift. What causes the earthquake?",c:["Stress builds up and is suddenly released when the rocks slip","Magma rises and pushes the rocks apart","The plates suddenly start subducting","Ocean water seeps into the fault"],a:0,e:"Friction locks the plates while <b>stress builds</b>. When the rocks finally <b>slip</b>, the stored energy is released as an <b>earthquake</b>."},
   {q:"Which boundary type forms the TALLEST mountains on Earth?",c:["Continental–continental convergent","Divergent","Transform","Oceanic–oceanic convergent"],a:0,e:"<b>Continent–continent collisions</b> stack thick crust upward into the tallest ranges, like the Himalayas (Mount Everest)."}
  ]},

function shade(hex,amt){let c=hex.replace("#","");if(c.length===3)c=c.split("").map(x=>x+x).join("");const n=parseInt(c,16);let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}

 R={reg,grid,enemies:[],guideDone:!!reg.final,stationDone:!!reg.final,killed:0,total:0,gateOpen:false,pool:shuffle(reg.qs.slice()),boss:null};
 let fi=0;
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
  const ch=grid[y][x];
  if(ch==="P"){P.x=x*TILE+TILE/2;P.y=y*TILE+TILE/2;grid[y][x]="."}
  if(ch==="E"){const f=reg.foes[fi%reg.foes.length];R.enemies.push({x:x*TILE+TILE/2,y:y*TILE+TILE/2,w:26,h:26,vx:0,vy:0,t:0,name:f[0],color:f[1],k:fi,hp:3,max:3,ph:Math.random()*6});fi++;grid[y][x]="."}
  if(ch==="B"){R.boss={x:x*TILE+TILE/2,y:y*TILE+TILE/2,hp:10,max:10}}
 }
 R.total=R.enemies.length;
 S.inv=60;
 updateHUD();
 if(!reg.final) toast(`📍 ${reg.name}: Talk to ${reg.guide.name}, finish the lab, and defeat ${R.total} monsters to open the gate!`,4200);
 else {toast("⚠️ The Magma King awaits… Walk up to him when you’re ready!",4000);sfx("rumble")}
}
function isSolid(tx,ty,isP){
 if(ty<0||ty>=ROWS)return true;
 if(tx>=COLS)return !(isP&&R.gateOpen);
 if(tx<0)return true;
 const ch=R.grid[ty][tx];
 if(ch===">")return !(isP&&R.gateOpen);
 return "#wlmtGSCcB".includes(ch);
}
function moveEnt(e,mx,my,isP){
 const nx=e.x+mx,ny=e.y+my,hw=e.w/2,hh=e.h/2;
 const pts=[[nx-hw,ny-hh],[nx+hw,ny-hh],[nx-hw,ny+hh],[nx+hw,ny+hh]];
 for(const [px,py] of pts){const tx=Math.floor(px/TILE),ty=Math.floor(py/TILE);
  if(isSolid(tx,ty,isP)){if(isP)bump(tx,ty);return false}}
 e.x=nx;e.y=ny;return true;
}
function bump(tx,ty){
 if(S.bumpCD>0||S.paused)return;
 const ch=(R.grid[ty]||[])[tx];
 if(ch==="G"){S.bumpCD=30;openGuide()}
 else if(ch==="S"){S.bumpCD=30;if(R.stationDone)toast("✅ Lab complete! "+(R.killed<R.total?"Now defeat the monsters.":""));else openStation()}
 else if(ch==="C"){S.bumpCD=30;openChest(tx,ty)}
 else if(ch==="B"){S.bumpCD=30;openBoss()}
 else if(ch===">"&&!R.gateOpen){S.bumpCD=90;const need=[];if(!R.guideDone)need.push("talk to "+R.reg.guide.name);if(!R.stationDone)need.push("finish the lab station");if(R.killed<R.total)need.push(`defeat ${R.total-R.killed} more monster${R.total-R.killed>1?"s":""}`);toast("🔒 Gate locked! You still need to: "+need.join(", "),3500);sfx("bad")}
}
function checkGate(){
 if(R.gateOpen||R.reg.final)return;
 if(R.guideDone&&R.stationDone&&R.killed>=R.total){
  R.gateOpen=true;sfx("gate");
  if(!S.codes.includes(R.reg.code))S.codes.push(R.reg.code);
  updateHUD();
  setTimeout(()=>showPanel(`<div class="center"><h2>✨ Tectonic Crystal Recovered! ✨</h2>${crystalSVG(R.reg.crystal,110)}
  <p style="font-size:18px">You mastered <b>${R.reg.name}</b>!<br>Write this <b>Mission Code</b> on your recording sheet:</p>
  <div class="bigcode">${R.reg.code}</div><p class="ins">The gate on the right side of the map is now open. Head east ➡️</p>
  <button class="btn green" id="ok">Continue</button></div>`,()=>{$("#ok").onclick=()=>{save(S.room+1);closePanel()}}),350);
 }
}

function stripesTask(el,next){
 const N=6;let step=0;
 let svg=`<svg viewBox="0 0 520 200" width="520" id="strp">`;
 for(let s=-N;s<=N;s++){const age=Math.abs(s)*4;const w=36;const x=260+s*w-w/2;
  svg+=`<rect x="${x}" y="20" width="${w}" height="150" fill="${s%2===0?"#4a5568":"#6b7686"}" data-age="${age}" data-s="${s}" style="cursor:pointer"/>`}
 svg+=`<line x1="260" y1="12" x2="260" y2="178" stroke="#ff7b1c" stroke-width="4" stroke-dasharray="6 5"/><text x="214" y="194" font-size="13" fill="#fff" font-family="Verdana">Mid-ocean ridge</text>
 <text x="20" y="194" font-size="13" fill="#fff" font-family="Verdana">← West</text><text x="450" y="194" font-size="13" fill="#fff" font-family="Verdana">East →</text><g id="ages"></g></svg>`;
 el.innerHTML=`<h3>Part 2 · Read the Seafloor</h3><p class="ins" id="sq">This is a top-down view of the ocean floor. <b>Tap the YOUNGEST rock.</b></p><div class="labview">${svg}</div><div class="msg"></div>`;
 const msg=t=>el.querySelector(".msg").innerHTML=t;
 el.querySelectorAll("#strp rect").forEach(r=>r.onclick=()=>{
  const s=+r.dataset.s;
  if(step===0){if(s===0){sfx("good");step=1;msg("✅ Right! New rock forms at the ridge.");$("#sq").innerHTML="<b>Now tap the OLDEST rock.</b>"}else{sfx("bad");msg("❌ Where does magma rise and cool into NEW rock?")}}
  else if(step===1){if(Math.abs(s)===N){sfx("good");step=2;msg("✅ Yes! Rock gets older farther from the ridge — on BOTH sides.");
    $("#ages").innerHTML=Array.from({length:2*N+1},(_,j)=>{const ss=j-N;return `<text x="${260+ss*36-8}" y="100" font-size="12" fill="#ffe08a" font-family="Verdana" font-weight="bold">${Math.abs(ss)*4}</text>`}).join("")+`<text x="150" y="14" font-size="12" fill="#ffe08a" font-family="Verdana">Ages in millions of years (mirror pattern!)</text>`;
    setTimeout(next,2200)}
   else{sfx("bad");msg("❌ The oldest rock is the farthest from where new rock forms.")}}
 });
}

 const run=()=>{
  let key,svg,txt;
  if(M==="slide"){key="TR";svg=labSVG("TR");txt="<b>Transform boundary!</b> The plates grind past each other sideways. Crust is <b>neither created nor destroyed</b>. Stress builds up and is released as <b>earthquakes</b>. No volcanoes. <i>Example: San Andreas Fault.</i>"}
  else if(M==="apart"){key="DV";const cc=A==="C"&&Bp==="C";svg=labSVG(cc?"DVC":"DVO");txt=cc?"<b>Divergent boundary on a continent!</b> The land stretches and drops into a <b>rift valley</b>. Magma rises and forms new crust. Keep going and it becomes a narrow sea, then an ocean basin. <i>Example: East African Rift.</i>":"<b>Divergent boundary!</b> Magma rises into the gap and cools into <b>new oceanic crust</b> at a <b>mid-ocean ridge</b>. Rock is youngest at the ridge. <i>Example: Mid-Atlantic Ridge.</i>"}

  const isNew=!got[key];got[key]=true;sfx(isNew?"good":"tap");

 };

function hotTask(el,done){
 const HX=400,SP=70;let s=0,maxS=0,timer=null;
 el.innerHTML=`<div class="labview"><svg viewBox="0 0 460 240" width="460" id="hs"></svg></div>
 <div class="row" style="margin-top:8px"><button class="btn alt" id="play">▶ Play</button><div style="flex:1"><input type="range" id="tm" min="0" max="5" step="0.05" value="0"></div><b id="tml" style="min-width:150px">0.0 million years</b></div>
 <div class="result" id="hres">The hot spot (red plume) stays in one place. Watch what happens to the volcanoes as the plate moves.</div><div id="hq"></div>`;
 const draw=()=>{
  let g=`<rect width="460" height="240" fill="#a8432a"/><rect width="460" height="70" fill="#bfe3ff"/><rect y="70" width="460" height="55" fill="#2f7fd0"/>
  <text x="8" y="18" font-size="13" fill="#0b2a4a" font-family="Verdana" font-weight="bold">← Northwest</text><text x="360" y="18" font-size="13" fill="#0b2a4a" font-family="Verdana" font-weight="bold">Southeast →</text>`;
  const off=-s*SP;
  g+=`<g transform="translate(${off%40},0)">${Array.from({length:14},(_,i)=>`<rect x="${i*40-40}" y="125" width="40" height="22" fill="${i%2?"#4a5568":"#525e70"}"/>`).join("")}</g>`;
  g+=`<path d="M${HX-22} 240 C${HX-12} 200 ${HX-14} 170 ${HX-8} 147 L${HX+8} 147 C${HX+14} 170 ${HX+12} 200 ${HX+22} 240Z" fill="#ff3b1f" class="glow"/><text x="${HX-30}" y="232" font-size="12" fill="#fff" font-family="Verdana" font-weight="bold">HOT SPOT</text>`;
  for(let k=0;k<=5;k++){if(s<k)continue;const age=s-k;const x=HX-age*SP;if(x<-40)continue;
   let h=age<0.6?20+age*80:Math.max(12,68-(age-0.6)*12);const active=age<0.8;const w=h*0.45+16;
   g+=`<path d="M${x-w} 125 Q${x-w*0.3} ${125-h} ${x} ${125-h} Q${x+w*0.3} ${125-h} ${x+w} 125Z" fill="${active?"#6b4a3a":"#4f9a55"}" stroke="${active?"#3a2416":"#2f6b35"}" stroke-width="2"/>`;
   if(active)g+=`<path d="M${x-6} ${127-h} L${x} ${117-h} L${x+6} ${127-h}Z" fill="#ff3b1f" class="glow"/><path d="M${x} 147 L${x} ${125-h}" stroke="#ff7b1c" stroke-width="4"/>`;
   g+=`<text x="${x-22}" y="${(125-h)-10<30?30:(125-h)-10}" font-size="11" fill="#fff" font-family="Verdana" font-weight="bold">${age.toFixed(1)} My</text>`;
  }
  $("#hs").innerHTML=g;$("#tml").textContent=s.toFixed(1)+" million years";
  if(s>=5&&maxS<5){maxS=5;finish()}maxS=Math.max(maxS,s);
 };
 const finish=()=>{clearInterval(timer);timer=null;$("#play").textContent="▶ Play";sfx("good");
  $("#hres").innerHTML="🔍 <b>Observe:</b> Only the volcano over the hot spot is active. Older volcanoes were carried away, went extinct, and eroded. The chain gets <b>older the farther it is from the hot spot</b>.";
  chain($("#hq"),[
   (e,n)=>mcTask(e,{title:"Checkpoint 1",q:"In the simulation, which volcano was the OLDEST?",c:["The one farthest to the northwest","The one directly over the hot spot","They were all the same age","The one farthest to the southeast"],a:0,e:"The oldest volcano was carried the <b>farthest from the hot spot</b> — to the northwest."},n),
   (e,n)=>mcTask(e,{title:"Checkpoint 2",q:"Which direction was the plate moving?",c:["Toward the northwest","Toward the southeast","It was not moving — the hot spot moved","Down into the mantle"],a:0,e:"The plate carried the volcanoes <b>northwest</b>, away from the stationary hot spot. That is exactly how the Hawaiian Islands formed."},n),
   (e,n)=>mcTask(e,{title:"Checkpoint 3 · Supervolcano",q:"Yellowstone is a supervolcano over a continental hot spot. A trail of older calderas stretches to its SOUTHWEST. Which way is the North American plate moving?",c:["Southwest","Northeast","North","The plate is not moving"],a:0,e:"Older volcanoes lie in the direction the plate is moving, so the North American plate is moving <b>southwest</b> over the Yellowstone hot spot."},n)
  ],done);
 };
 $("#tm").oninput=e=>{s=+e.target.value;draw()};
 $("#play").onclick=()=>{if(timer){clearInterval(timer);timer=null;$("#play").textContent="▶ Play";return}
  if(s>=5){s=0}$("#play").textContent="⏸ Pause";timer=setInterval(()=>{s=Math.min(5,s+0.04);$("#tm").value=s;draw();if(s>=5&&timer){clearInterval(timer);timer=null;$("#play").textContent="▶ Play"}},40)};
 draw();
}

 </div>

  <div class="fb" id="fb"></div></div>`;
 showPanel(html);
 const pick=b=>{if(B.answered||b.disabled)return;const i=+b.dataset.i;
  if(!multi){B.picked=[i];answer();return}
  if(B.picked.includes(i)){B.picked=B.picked.filter(x=>x!==i);b.classList.remove("picked")}
  else{if(B.picked.length>=need)return;B.picked.push(i);b.classList.add("picked")}
  sfx("tap");const sb=$("#sub");sb.disabled=B.picked.length!==need;sb.textContent=`Submit (${B.picked.length}/${need})`};
 document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>pick(b));
 if(multi)$("#sub").onclick=()=>{if(B.picked.length===need)answer()};
 $("#scan").onclick=()=>{if(B.scan<1||B.answered)return;const wrong=[...document.querySelectorAll(".choice")].filter(b=>!b.disabled&&+b.dataset.i!==q.a);if(!wrong.length)return;const w=wrong[Math.floor(Math.random()*wrong.length)];w.disabled=true;w.classList.add("gone");B.scan--;sfx("tap");$("#scan").textContent=`🔍 Seismic Scan (${B.scan} left)`;if(B.scan<1)$("#scan").disabled=true};
 battleKeys=k=>{if(B.answered){if(k==="enter"||k===" ")$("#cont")&&$("#cont").click();return}

function answer(){
 B.answered=true;const q=B.q,multi=!!q.multi;S.attempts++;

 }else{S.streak=0;S.missed.push(q.q.replace(/<[^>]+>/g," ").replace(/\s+/g," ").slice(0,110));R.pool.push(q);
  arena.insertAdjacentHTML("beforeend",`<div class="flash"></div>`);arena.classList.add("shake");

 }

 const done=B.en.hp<=0,dead=S.hp<=0;

 <table><tr><td>Questions correct</td><td><b>${S.correct} / ${S.attempts}</b></td></tr><tr><td>Accuracy</td><td><b>${acc}%</b></td></tr><tr><td>Best streak</td><td><b>${S.best}</b></td></tr><tr><td>Level reached</td><td><b>${S.lvl}</b></td></tr><tr><td>Time</td><td><b>${Math.floor(secs/60)} min ${secs%60} sec</b></td></tr></table>
 <div>Mission Codes</div><div class="codes">${ROOMS.slice(0,5).map(r=>`<span>${r.code}</span>`).join("")}<span>CROWN</span></div>
 ${miss.length?`<details style="text-align:left;margin-top:10px"><summary><b>Questions to review (${miss.length})</b></summary><ul style="font-size:14px">${miss.map(m=>`<li>${esc(m)}…</li>`).join("")}</ul></details>`:"<p><b>Flawless — no missed questions!</b></p>"}
 <p style="font-size:13px">Show this screen to your teacher. Final code: <b>CROWN</b></p></div>
 <div class="row noprint" style="justify-content:center;margin-top:14px"><button class="btn alt" id="pr">🖨️ Print</button><button class="btn" id="again">Play again</button></div>`,()=>{$("#pr").onclick=()=>{try{window.print()}catch(e){}};$("#again").onclick=()=>location.reload()});
 S.codes.push("CROWN");updateHUD();
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

/* ================= JOURNAL / HELP ================= */
function openJournal(){
 if(!R)return;
 const unlocked=i=>i<S.room||(i===S.room&&R.guideDone);
 showPanel(`<div class="journal"><h2>📓 Field Journal</h2><p class="ins">Everything you need to know for TEKS 7.10B. New pages unlock when you talk to each region’s guide.</p>
 ${ROOMS.slice(0,5).map((r,i)=>`<div class="reg"><h3 style="color:${r.crystal}">${r.name}</h3>${unlocked(i)?r.lesson.map(p=>`<div class="page"><h4>${p.h}</h4>${p.b}</div>`).join(""):`<div class="locked">🔒 Locked — talk to ${r.guide.name} in ${r.name} to unlock.</div>`}</div>`).join("")}
 <div class="center"><button class="btn" id="cl">Close journal</button></div></div>`,()=>{$("#cl").onclick=closePanel});
}
function openHelp(){
 showPanel(`<h2>❓ How to Play</h2><div class="howto">
 <div><b>🕹️ Move</b><br>Arrow keys or WASD. On a tablet, use the on-screen arrows.</div>
 <div><b>🧑‍🔬 Guides</b><br>Walk into the scientist in each region. Their lessons save to your 📓 Journal.</div>
 <div><b>🖥️ Lab Stations</b><br>Walk into the glowing console to do a hands-on simulation.</div>
 <div><b>👾 Monsters</b><br>Touch a monster to battle. Answer STAAR questions to attack. 3 correct in a row = CRITICAL HIT.</div>
 <div><b>🔍 Seismic Scan</b><br>Removes one wrong answer. One per battle (two vs. the boss).</div>
 <div><b>🎁 Chests</b><br>Heal you or give a Crust Shield that blocks one wrong answer.</div>
 <div><b>🔒 Gates</b><br>Open when you finish the guide, lab, and all monsters. Write down each Mission Code!</div>
 <div><b>👑 Goal</b><br>Recover all 5 crystals and defeat the Magma King.</div></div>
 <div class="center" style="margin-top:14px"><button class="btn" id="cl">Got it!</button></div>`,()=>{$("#cl").onclick=closePanel});
}

/* ================= SAVE ================= */
function save(room){try{localStorage.setItem(SAVE,JSON.stringify({name:S.name,room,xp:S.xp,lvl:S.lvl,maxhp:S.maxhp,correct:S.correct,attempts:S.attempts,missed:S.missed,codes:S.codes,best:S.best,elapsed:Math.round((Date.now()-S.start)/1000)+S.elapsedBefore}))}catch(e){}}
function loadSave(){try{return JSON.parse(localStorage.getItem(SAVE)||"null")}catch(e){return null}}

/* ================= INPUT ================= */
addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 if(e.target&&e.target.tagName==="INPUT")return;
 if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k)&&!S.paused)e.preventDefault();
 if(battleKeys&&!$("#overlay").classList.contains("hidden")){battleKeys(k);return}
 keys[k]=true;
});
addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false});
addEventListener("blur",()=>{for(const k in keys)keys[k]=false});
document.querySelectorAll("#dpad button").forEach(b=>{const k=b.dataset.k;
 const on=e=>{e.preventDefault();touch[k]=true},off=e=>{e.preventDefault();touch[k]=false};
 b.addEventListener("pointerdown",on);b.addEventListener("pointerup",off);b.addEventListener("pointerleave",off);b.addEventListener("pointercancel",off)});
if(("ontouchstart" in window)||matchMedia("(pointer:coarse)").matches)$("#dpad").style.display="flex";
$("#bJournal").onclick=()=>{if(!S.paused)openJournal()};
$("#bHelp").onclick=()=>{if(!S.paused)openHelp()};
$("#bSound").onclick=()=>{soundOn=!soundOn;$("#bSound").textContent=soundOn?"🔊":"🔇"};

/* ================= UPDATE ================= */
function update(dt){
 frame++;
 if(S.bumpCD>0)S.bumpCD-=dt;
 if(S.paused||!R)return;
 if(S.inv>0)S.inv-=dt;
 let dx=0,dy=0;
 if(keys.arrowleft||keys.a||touch.l)dx--;if(keys.arrowright||keys.d||touch.r)dx++;
 if(keys.arrowup||keys.w||touch.u)dy--;if(keys.arrowdown||keys.s||touch.d)dy++;
 if(dx&&dy){dx*=.707;dy*=.707}
 const sp=3.3*dt;P.moving=!!(dx||dy);
 if(dx)P.dir=dx>0?1:-1;
 if(P.moving)P.anim+=dt*.25;
 moveEnt(P,dx*sp,0,true);moveEnt(P,0,dy*sp,true);
 if(R.gateOpen&&P.x>COLS*TILE-6){if(S.room<ROOMS.length-1){loadRoom(S.room+1)}return}
 for(const e of R.enemies){
  e.t-=dt;e.ph+=dt*.08;
  if(e.t<=0){const r=Math.random();const dirs=[[1,0],[-1,0],[0,1],[0,-1],[0,0]];const d=dirs[Math.floor(r*5)];
   const tx=P.x-e.x,ty=P.y-e.y,dist=Math.hypot(tx,ty);
   if(dist<160&&Math.random()<.5){e.vx=Math.sign(tx)*(Math.abs(tx)>Math.abs(ty)?1:0);e.vy=Math.sign(ty)*(Math.abs(ty)>=Math.abs(tx)?1:0)}else{e.vx=d[0];e.vy=d[1]}
   e.t=40+Math.random()*60}
  const es=1.1*dt;if(!moveEnt(e,e.vx*es,0,false))e.vx*=-1;if(!moveEnt(e,0,e.vy*es,false))e.vy*=-1;
  if(S.inv<=0&&Math.hypot(P.x-e.x,P.y-e.y)<28){startBattle(e,false);break}
 }
}

/* ================= DRAW ================= */
function hash(x,y){let h=(x*374761393+y*668265263)^0x5bd1e995;h=(h^(h>>>13))*1274126177;return ((h^(h>>>16))>>>0)/4294967295}
function drawFloor(x,y,th){const px=x*TILE,py=y*TILE;ctx.fillStyle=(x+y)%2?th.floor:th.floor2;ctx.fillRect(px,py,TILE,TILE);ctx.fillStyle=th.speck;
 for(let i=0;i<3;i++){const hx=hash(x*3+i,y),hy=hash(y*5+i,x);ctx.fillRect(px+hx*36,py+hy*36,3,3)}}
function drawTile(ch,x,y,t,th){
 const px=x*TILE,py=y*TILE;
 if(ch==="#"){ctx.fillStyle=th.wall;ctx.fillRect(px,py,TILE,TILE);ctx.fillStyle=th.wallTop;ctx.fillRect(px,py,TILE,8);ctx.fillStyle="rgba(0,0,0,.25)";ctx.fillRect(px+(y%2?0:20),py+20,2,20);ctx.fillRect(px,py+20,TILE,2);return}
 if(ch==="w"){ctx.fillStyle="#1f6fb5";ctx.fillRect(px,py,TILE,TILE);ctx.strokeStyle="rgba(255,255,255,.28)";ctx.lineWidth=2;const o=Math.sin(t/30+x+y)*4;ctx.beginPath();ctx.moveTo(px+6,py+14+o);ctx.quadraticCurveTo(px+14,py+8+o,px+22,py+14+o);ctx.moveTo(px+18,py+30-o);ctx.quadraticCurveTo(px+26,py+24-o,px+34,py+30-o);ctx.stroke();return}
 if(ch==="l"){ctx.fillStyle="#d8400f";ctx.fillRect(px,py,TILE,TILE);const g=.5+.5*Math.sin(t/20+x*1.7+y);ctx.fillStyle=`rgba(255,200,60,${.35+g*.4})`;ctx.beginPath();ctx.arc(px+12+hash(x,y)*14,py+14,6+g*3,0,7);ctx.arc(px+26,py+28-hash(y,x)*8,5+g*2,0,7);ctx.fill();return}
 drawFloor(x,y,th);
 if(ch==="f"){ctx.strokeStyle="#2a1a10";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+14,py+18);ctx.lineTo(px+22,py+16);ctx.lineTo(px+40,py+40);ctx.stroke();return}
 if(ch==="m"){ctx.fillStyle=th.mtn;ctx.beginPath();ctx.moveTo(px-2,py+TILE);ctx.lineTo(px+20,py-6);ctx.lineTo(px+42,py+TILE);ctx.fill();ctx.fillStyle=th.cap;ctx.beginPath();ctx.moveTo(px+13,py+6);ctx.lineTo(px+20,py-6);ctx.lineTo(px+27,py+6);ctx.fill();return}
 if(ch==="t"){drawDeco(px,py,th);return}
 if(ch==="G"){drawPerson(px+20,py+22,R.reg.guide,1,0);if(!R.guideDone){const b=Math.sin(t/8)*3;ctx.fillStyle="#ffd166";ctx.beginPath();ctx.arc(px+20,py-8+b,10,0,7);ctx.fill();ctx.fillStyle="#2a1a12";ctx.font="bold 16px Verdana";ctx.textAlign="center";ctx.fillText("!",px+20,py-2+b)}return}
 if(ch==="S"){ctx.fillStyle="#2b2f3a";ctx.fillRect(px+4,py+8,32,30);ctx.fillStyle="#1b1e26";ctx.fillRect(px+4,py+32,32,6);const g=.6+.4*Math.sin(t/12);ctx.fillStyle=R.stationDone?"#2fd47a":`rgba(80,220,255,${g})`;ctx.fillRect(px+8,py+12,24,16);ctx.fillStyle="#0b0b0b";ctx.font="bold 12px Verdana";ctx.textAlign="center";ctx.fillText(R.stationDone?"✓":"LAB",px+20,py+24);if(!R.stationDone){ctx.fillStyle="#ffd166";ctx.font="bold 16px Verdana";ctx.fillText("?",px+20,py+4+Math.sin(t/8)*3)}return}
 if(ch==="C"||ch==="c"){ctx.fillStyle="#7a4a1e";ctx.fillRect(px+7,py+16,26,18);ctx.fillStyle=ch==="C"?"#9b5e28":"#3a2410";ctx.fillRect(px+7,py+(ch==="C"?10:6),26,ch==="C"?8:6);ctx.fillStyle="#ffd166";ctx.fillRect(px+18,py+16,4,6);if(ch==="C"){ctx.fillStyle=`rgba(255,209,102,${.3+.3*Math.sin(t/10)})`;ctx.beginPath();ctx.arc(px+20,py+20,20,0,7);ctx.fill()}return}
 if(ch===">"){if(R.gateOpen){ctx.fillStyle=`rgba(47,212,122,${.4+.3*Math.sin(t/8)})`;ctx.fillRect(px,py,TILE,TILE);ctx.fillStyle="#fff";ctx.font="bold 22px Verdana";ctx.textAlign="center";ctx.fillText("➜",px+20,py+28)}else{ctx.fillStyle="#3a0d0d";ctx.fillRect(px,py,TILE,TILE);for(let i=0;i<4;i++){ctx.fillStyle=`rgba(255,60,60,${.5+.4*Math.sin(t/6+i)})`;ctx.fillRect(px+4+i*9,py,4,TILE)}ctx.font="16px Verdana";ctx.textAlign="center";ctx.fillText("🔒",px+20,py+26)}return}
}
function drawDeco(px,py,th){
 const c=th.decoC;
 if(th.deco==="spike"||th.deco==="obsidian"){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(px+8,py+38);ctx.lineTo(px+16,py+4);ctx.lineTo(px+24,py+38);ctx.fill();ctx.beginPath();ctx.moveTo(px+20,py+38);ctx.lineTo(px+28,py+14);ctx.lineTo(px+34,py+38);ctx.fill();if(th.deco==="obsidian"){ctx.fillStyle="#7a2cff";ctx.fillRect(px+15,py+12,2,14)}}
 else if(th.deco==="tree"||th.deco==="pine"){ctx.fillStyle="#5a3a1e";ctx.fillRect(px+17,py+26,6,12);ctx.fillStyle=c;if(th.deco==="pine"){ctx.beginPath();ctx.moveTo(px+6,py+30);ctx.lineTo(px+20,py+2);ctx.lineTo(px+34,py+30);ctx.fill()}else{ctx.beginPath();ctx.arc(px+20,py+18,14,0,7);ctx.fill()}}
 else if(th.deco==="palm"){ctx.strokeStyle="#7a5a2e";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(px+18,py+38);ctx.quadraticCurveTo(px+14,py+20,px+22,py+10);ctx.stroke();ctx.strokeStyle=c;ctx.lineWidth=5;ctx.beginPath();[[-14,4],[14,4],[-10,-8],[10,-8]].forEach(([a,b])=>{ctx.moveTo(px+22,py+10);ctx.quadraticCurveTo(px+22+a/2,py+10+b-6,px+22+a,py+10+b+6)});ctx.stroke()}
 else{ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(px+20,py+26,15,11,0,0,7);ctx.fill();ctx.fillStyle="rgba(255,255,255,.15)";ctx.beginPath();ctx.ellipse(px+15,py+22,6,4,0,0,7);ctx.fill()}
}
function drawPerson(x,y,c,dir,anim,isP){
 const leg=Math.sin(anim)*4;
 ctx.fillStyle="rgba(0,0,0,.3)";ctx.beginPath();ctx.ellipse(x,y+16,12,4,0,0,7);ctx.fill();
 ctx.fillStyle="#2a2a3a";ctx.fillRect(x-7,y+6+(isP?leg*.5:0),5,10);ctx.fillRect(x+2,y+6-(isP?leg*.5:0),5,10);
 ctx.fillStyle=c.coat;ctx.fillRect(x-10,y-8,20,17);ctx.fillStyle=c.shirt;ctx.fillRect(x-3,y-8,6,12);
 ctx.fillStyle=c.skin;ctx.beginPath();ctx.arc(x,y-15,8,0,7);ctx.fill();
 ctx.fillStyle=c.hair;ctx.fillRect(x-8,y-24,16,6);
 if(isP){ctx.fillStyle="#7a4a1e";ctx.fillRect(x-12,y-24,24,4);ctx.fillRect(x-7,y-30,14,7)}
 ctx.fillStyle="#111";ctx.fillRect(x-4+dir*2,y-16,2,3);ctx.fillRect(x+2+dir*2,y-16,2,3);
}
function drawEnemy(e,t){
 const b=Math.sin(e.ph)*3,x=e.x,y=e.y+b;
 ctx.fillStyle="rgba(0,0,0,.3)";ctx.beginPath();ctx.ellipse(e.x,e.y+15,13,4,0,0,7);ctx.fill();
 ctx.fillStyle=shade(e.color,-45);
 if(e.k%3===0){ctx.beginPath();ctx.moveTo(x-12,y-8);ctx.lineTo(x-6,y-22);ctx.lineTo(x,y-10);ctx.lineTo(x+6,y-22);ctx.lineTo(x+12,y-8);ctx.fill()}
 else if(e.k%3===1){ctx.fillRect(x-12,y-20,4,12);ctx.fillRect(x+8,y-20,4,12)}
 else{ctx.beginPath();ctx.arc(x-7,y-12,5,0,7);ctx.arc(x+7,y-13,5,0,7);ctx.fill()}
 ctx.fillStyle=e.color;ctx.beginPath();ctx.ellipse(x,y,15,13,0,0,7);ctx.fill();
 const ang=Math.atan2(P.y-e.y,P.x-e.x),ox=Math.cos(ang)*2,oy=Math.sin(ang)*2;
 ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(x-5,y-2,4,0,7);ctx.arc(x+5,y-2,4,0,7);ctx.fill();
 ctx.fillStyle="#111";ctx.beginPath();ctx.arc(x-5+ox,y-2+oy,2,0,7);ctx.arc(x+5+ox,y-2+oy,2,0,7);ctx.fill();
}
function drawBoss(t){
 const bo=R.boss,b=Math.sin(t/14)*4,x=bo.x,y=bo.y+b;
 const g=ctx.createRadialGradient(x,y,10,x,y,70);g.addColorStop(0,"rgba(255,120,40,.55)");g.addColorStop(1,"rgba(255,60,20,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,70,0,7);ctx.fill();
 ctx.fillStyle="#b3260c";ctx.beginPath();ctx.ellipse(x,y+4,34,30,0,0,7);ctx.fill();
 ctx.fillStyle="#ff6a1f";ctx.beginPath();ctx.ellipse(x,y+10,22,16,0,0,7);ctx.fill();
 ctx.fillStyle="#ffd166";ctx.beginPath();ctx.moveTo(x-20,y-22);ctx.lineTo(x-16,y-40);ctx.lineTo(x-6,y-28);ctx.lineTo(x,y-44);ctx.lineTo(x+6,y-28);ctx.lineTo(x+16,y-40);ctx.lineTo(x+20,y-22);ctx.fill();
 ctx.fillStyle="#fff6a8";ctx.beginPath();ctx.arc(x-11,y-4,6,0,7);ctx.arc(x+11,y-4,6,0,7);ctx.fill();ctx.fillStyle="#111";ctx.beginPath();ctx.arc(x-10,y-3,3,0,7);ctx.arc(x+10,y-3,3,0,7);ctx.fill();
 ctx.fillStyle="#fff";ctx.font="bold 13px Verdana";ctx.textAlign="center";ctx.fillText("THE MAGMA KING",x,y+50);
}
const PLAYER_C={coat:"#1f9e8f",shirt:"#ffd166",skin:"#e2a878",hair:"#4a2a12"};
function draw(){
 const t=frame,th=R?R.reg.theme:ROOMS[0].theme;
 ctx.clearRect(0,0,cv.width,cv.height);
 if(!R){ctx.fillStyle="#120b08";ctx.fillRect(0,0,cv.width,cv.height);return}
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)drawTile(R.grid[y][x],x,y,t,th);
 for(const e of R.enemies)drawEnemy(e,t);
 if(R.boss)drawBoss(t);
 if(!(S.inv>0&&Math.floor(t/4)%2))drawPerson(P.x,P.y,PLAYER_C,P.dir,P.anim,true);
 const vg=ctx.createRadialGradient(480,280,200,480,280,600);vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,"rgba(0,0,0,.45)");ctx.fillStyle=vg;ctx.fillRect(0,0,cv.width,cv.height);
}
let last=performance.now();
function loop(now){const dt=Math.min(3,(now-last)/16.67);last=now;update(dt);draw();requestAnimationFrame(loop)}

/* ================= TITLE ================= */
function title(){
 const sv=loadSave();
 showPanel(`<div class="center"><div class="logo">TECTONIC QUEST</div><div class="subt">RISE OF THE MAGMA KING</div><div class="teks">TEKS 7.10B · Plate Tectonics · STAAR Review Adventure</div>
 <div class="row" style="justify-content:center;gap:4px">${ROOMS.slice(0,5).map(r=>crystalSVG(r.crystal,34)).join("")}</div>
 <p style="max-width:640px;margin:10px auto;font-size:17px">The <b>Magma King</b> has shattered the 5 Tectonic Crystals and is tearing Earth’s plates apart! Explore 5 regions, learn from the scientists, run lab simulations, and battle monsters with <b>STAAR-level questions</b> to win back each crystal. Then face the King himself.</p>
 <div style="margin:12px 0"><input type="text" id="nm" maxlength="24" placeholder="Type your first & last name" value="${sv?esc(sv.name):""}"></div>
 <div class="row" style="justify-content:center"><button class="btn" id="st">▶ New Game</button>${sv?`<button class="btn alt" id="ct">⏩ Continue (Region ${sv.room+1})</button>`:""}</div>
 <div class="howto"><div><b>🕹️ Move:</b> Arrow keys / WASD (or on-screen arrows)</div><div><b>🧑‍🔬 Learn:</b> walk into guides & lab stations</div><div><b>👾 Battle:</b> walk into monsters, answer to attack</div><div><b>📝 Record:</b> write down each Mission Code</div></div></div>`,()=>{
  const go=cont=>{const n=$("#nm").value.trim();if(!n){$("#nm").focus();$("#nm").classList.add("shake");setTimeout(()=>$("#nm").classList.remove("shake"),400);return}
   S.name=n;sfx("gate");
   if(cont&&sv){Object.assign(S,{xp:sv.xp,lvl:sv.lvl,maxhp:sv.maxhp,hp:sv.maxhp,correct:sv.correct,attempts:sv.attempts,missed:sv.missed||[],codes:sv.codes||[],best:sv.best||0,elapsedBefore:sv.elapsed||0});S.start=Date.now();closePanel();loadRoom(sv.room)}
   else{S.start=Date.now();closePanel();loadRoom(0);setTimeout(()=>{if(!S.paused)openHelp()},300)}};
  $("#st").onclick=()=>go(false);if(sv)$("#ct").onclick=()=>go(true);
  $("#nm").addEventListener("keydown",e=>{if(e.key==="Enter")go(!!sv&&false)});
 });
}
updateHUD();requestAnimationFrame(loop);title();
</script>
