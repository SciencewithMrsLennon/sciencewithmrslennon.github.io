<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Storm Quest: Fury of the Storm Tyrant</title>
<style>
:root{--ink:#fff6e8;--muted:#d9c6ad;--accent:#ff7a3d;--good:#2fd47a;--bad:#ff4d5e;--gold:#ffd166;--panel:#211915;--line:#5a3b2c}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(circle at 50% -10%,#3a2016,#0b0605 70%);color:var(--ink);font-family:"Trebuchet MS",Verdana,system-ui,sans-serif;min-height:100vh}
#app{max-width:1000px;margin:0 auto;padding:10px}
#hud{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#1c1411;border:3px solid #3e2a20;border-radius:14px;padding:8px 12px;margin-bottom:8px}
#hud .reg{flex:1 1 200px;min-width:180px}
#hud .reg b{font-size:18px;display:block;letter-spacing:.5px}
#hud .reg span{font-size:12px;color:var(--muted)}
.bar{width:130px;height:14px;background:#000;border:2px solid #555;border-radius:8px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(#5dff9d,#1fae5a);transition:width .3s}
.bar.xp>i{background:linear-gradient(#ffe38a,#e0a100)}
.stat{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.stat b{color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:4px 8px;border-radius:20px;background:#2e221d;border:2px solid #4a3529;color:var(--muted);white-space:nowrap}
.chip.done{background:#163b26;border-color:#2fd47a;color:#c9ffe0}
.crys{display:flex;gap:3px}
.crys i{width:14px;height:18px;clip-path:polygon(50% 0,100% 35%,50% 100%,0 35%);background:#3a2c26;display:block}
.hbtn{background:#2e221d;border:2px solid #5a3b2c;color:var(--ink);border-radius:10px;padding:6px 10px;font-size:15px;cursor:pointer}
.hbtn:hover{background:#3d2c25}
#stage{position:relative;border:4px solid #3e2a20;border-radius:14px;overflow:hidden;background:#000;box-shadow:0 10px 40px #000}
canvas{display:block;width:100%;height:auto}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(20,12,9,.92);border:2px solid var(--gold);color:var(--ink);padding:8px 16px;border-radius:12px;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1}
#dpad{display:none;justify-content:center;gap:40px;margin-top:10px;user-select:none;-webkit-user-select:none;touch-action:none}
#dpad .pad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:4px}
#dpad button{background:#2e221d;border:3px solid #5a3b2c;color:#fff;border-radius:12px;font-size:24px;touch-action:none}
#dpad button:active{background:#5a3b2c}
#tip{font-size:13px;color:var(--muted);text-align:center;margin-top:8px}
#overlay{position:fixed;inset:0;background:rgba(6,3,2,.8);display:flex;align-items:flex-start;justify-content:center;overflow:auto;z-index:50;padding:14px}
#overlay.hidden{display:none}
#panel{background:linear-gradient(#2a1f1a,#1a1210);border:4px solid var(--line);border-radius:18px;max-width:900px;width:100%;padding:20px 22px;box-shadow:0 20px 60px #000;margin:auto;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
h2{margin:0 0 8px;font-size:24px;color:var(--gold)}
h3{margin:6px 0;font-size:19px}
p{line-height:1.5}
.btn{background:linear-gradient(#ff9a52,#e2571c);border:none;border-bottom:5px solid #9b3510;color:#fff;font-weight:bold;font-size:18px;padding:11px 22px;border-radius:12px;cursor:pointer;font-family:inherit;letter-spacing:.5px}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(3px);border-bottom-width:2px}
.btn.alt{background:linear-gradient(#5f7cff,#3550d6);border-bottom-color:#1f2f8a}
.btn.green{background:linear-gradient(#41e08b,#16a457);border-bottom-color:#0b6a36}
.btn:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.center{text-align:center}
/* title */
.logo{font-size:52px;font-weight:900;letter-spacing:3px;background:linear-gradient(#ffe08a,#ff7a3d 55%,#c8261b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #3a0f06);line-height:1.05}
.subt{font-size:22px;color:#ffb38a;font-weight:bold;letter-spacing:2px}
.teks{display:inline-block;margin:10px 0;padding:5px 12px;border:2px solid var(--gold);border-radius:20px;color:var(--gold);font-size:14px}
input[type=text]{font-size:20px;padding:10px 14px;border-radius:10px;border:3px solid var(--line);background:#120c0a;color:#fff;width:280px;font-family:inherit}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:16px;text-align:left}
.howto div{background:#1a1310;border:2px solid #3e2a20;border-radius:12px;padding:10px;font-size:14px;color:var(--muted)}
.howto b{color:var(--ink)}
/* dialogue */
.dlg{display:flex;gap:16px;align-items:flex-start}
.portrait{flex:0 0 120px;text-align:center;font-size:13px;color:var(--gold);font-weight:bold}
.bubble{flex:1;background:#fff8ec;color:#2a1a12;border-radius:16px;padding:14px 18px;position:relative;font-size:17px;line-height:1.55}
.bubble h3{color:#b8401a;margin-top:0}
.bubble b{color:#7a2408}
.bubble table{border-collapse:collapse;width:100%;font-size:14px;margin-top:6px}
.bubble td,.bubble th{border:1px solid #c9a98a;padding:5px 7px;text-align:left;vertical-align:top}
.bubble th{background:#f3d9bd}
.tipbox{background:#fff0c2;border-left:6px solid #e0a100;padding:8px 12px;border-radius:8px;margin-top:8px;font-size:15px}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.dots i{width:10px;height:10px;border-radius:50%;background:#4a3529}
.dots i.on{background:var(--gold)}
/* battle */
.arena{border-radius:14px;padding:12px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;min-height:200px;position:relative;overflow:hidden}
.fighter{font-size:14px}
.fighter b{font-size:17px;display:block;margin-bottom:4px}
.foe{text-align:right}
.foe .bar{margin-left:auto}
.bar.foehp>i{background:linear-gradient(#ff8a8a,#d62839)}
.mon{animation:bob 1.6s ease-in-out infinite;filter:drop-shadow(0 8px 8px rgba(0,0,0,.5))}
@keyframes bob{50%{transform:translateY(-8px)}}
.mon.hit{animation:hit .45s}
@keyframes hit{0%,100%{transform:none;filter:none}20%{transform:translateX(-14px) rotate(-6deg);filter:brightness(3)}50%{transform:translateX(12px) rotate(5deg)}70%{transform:translateX(-6px)}}
.shake{animation:shk .4s}
@keyframes shk{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.dmg{position:absolute;font-weight:900;font-size:34px;color:#ffe066;text-shadow:0 3px 0 #000;animation:fly 1s forwards;pointer-events:none}
@keyframes fly{to{transform:translateY(-60px);opacity:0}}
.flash{position:absolute;inset:0;background:#ff2e2e;opacity:0;pointer-events:none;animation:fl .5s}
@keyframes fl{30%{opacity:.45}}
.qcard{background:#fffaf1;color:#24170f;border-radius:14px;padding:14px 16px;margin-top:12px}
.qmeta{display:flex;justify-content:space-between;font-size:13px;font-weight:bold;color:#9a4a1e;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;gap:8px;flex-wrap:wrap}
.qtext{font-size:18px;line-height:1.5}
.qtext table{border-collapse:collapse;margin:8px 0;font-size:15px}
.qtext td,.qtext th{border:1.5px solid #9c7b5c;padding:5px 10px;text-align:center}
.qtext th{background:#f1dcc3}
.diag{margin:8px 0;text-align:center}
.diag svg{max-width:100%;height:auto;border-radius:10px;border:2px solid #9c7b5c}
.choices{display:grid;gap:8px;margin-top:10px}
.choice{display:flex;gap:10px;align-items:flex-start;text-align:left;background:#fff;border:3px solid #d8c2a8;border-radius:12px;padding:10px 12px;font-size:16px;cursor:pointer;color:#24170f;font-family:inherit;line-height:1.4}
.choice:hover:not(:disabled){border-color:#ff7a3d;background:#fff4e8}
.choice .lt{flex:0 0 28px;height:28px;border-radius:50%;background:#3b2a22;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold}
.choice.picked{border-color:#3550d6;background:#eef1ff}
.choice.correct{border-color:#16a457;background:#dcffe9}
.choice.wrong{border-color:#d62839;background:#ffe1e4}
.choice.gone{opacity:.25;text-decoration:line-through}
.choice:disabled{cursor:default}
.fb{margin-top:10px;padding:12px 14px;border-radius:12px;font-size:16px;line-height:1.5;display:none}
.fb.good{display:block;background:#dcffe9;border:2px solid #16a457}
.fb.bad{display:block;background:#ffe9eb;border:2px solid #d62839}
.fb b.h{font-size:19px;display:block;margin-bottom:3px}
.qact{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:10px;flex-wrap:wrap}
.scan{background:#2b3a66;color:#fff;border:none;border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer;font-family:inherit}
.scan:disabled{opacity:.4;cursor:default}
.streak{font-size:14px;font-weight:bold;color:#ff7a3d}
/* stations */
.ins{color:var(--muted);margin:2px 0 10px}
.bins{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.bin{background:#14100e;border:3px dashed #6b4a37;border-radius:14px;min-height:120px;padding:8px;cursor:pointer;transition:background .2s}
.bin:hover{background:#21170f}
.binh{font-weight:bold;color:var(--gold);text-align:center;margin-bottom:6px;font-size:16px}
.binc{display:flex;flex-wrap:wrap;gap:6px}
.cards{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;justify-content:center}
.card{background:#fff6e6;color:#2a1a12;border:3px solid #d8b994;border-radius:10px;padding:8px 10px;font-size:15px;cursor:pointer;font-family:inherit;max-width:260px}
.card.sel{border-color:#ff7a3d;box-shadow:0 0 0 4px rgba(255,122,61,.4);transform:translateY(-3px)}
.card.placed{font-size:13px;padding:5px 8px;cursor:default;background:#dcffe9;border-color:#16a457}
.msg{min-height:26px;text-align:center;margin-top:10px;font-weight:bold;color:var(--gold)}
.slots{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.slot{background:#14100e;border:2px dashed #6b4a37;border-radius:10px;padding:8px 12px;min-height:44px;display:flex;gap:10px;align-items:center}
.slot .n{flex:0 0 30px;height:30px;border-radius:50%;background:#5a3b2c;display:flex;align-items:center;justify-content:center;font-weight:bold}
.slot.fill{border-style:solid;border-color:#16a457;background:#123122}
.ocards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.ocard{background:#fff6e6;color:#2a1a12;border:3px solid #d8b994;border-radius:12px;padding:8px;font-size:14px;cursor:pointer;font-family:inherit;text-align:center}
.ocard svg{width:100%;height:auto;display:block;margin-bottom:4px;border-radius:8px}
.ocard.used{visibility:hidden}
.labctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:10px 0}
.labctl div{background:#14100e;border:2px solid #4a3529;border-radius:12px;padding:8px}
.labctl b{display:block;color:var(--gold);margin-bottom:6px;font-size:14px}
.tog{display:inline-block;margin:3px;padding:7px 10px;border-radius:10px;border:2px solid #6b4a37;background:#2a1f1a;color:#fff;cursor:pointer;font-family:inherit;font-size:14px}
.tog.on{background:#ff7a3d;border-color:#ffb38a}
.labview{background:#0e0a09;border-radius:14px;padding:6px;text-align:center}
.labview svg{max-width:100%;height:auto}
.result{background:#fff8ec;color:#2a1a12;border-radius:12px;padding:10px 14px;margin-top:8px;font-size:15px;line-height:1.5;min-height:60px}
.disc{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.disc span{font-size:13px;padding:5px 9px;border-radius:20px;border:2px solid #4a3529;color:var(--muted)}
.disc span.got{border-color:#2fd47a;color:#c9ffe0;background:#163b26}
.slideL{animation:slL 1.1s ease-out both}
.slideR{animation:slR 1.1s ease-out both}
.apartL{animation:apL 1.1s ease-out both}
.apartR{animation:apR 1.1s ease-out both}
.upS{animation:upS 1.1s ease-out both}
.dnS{animation:dnS 1.1s ease-out both}
@keyframes slL{from{transform:translateX(-45px)}}
@keyframes slR{from{transform:translateX(45px)}}
@keyframes apL{from{transform:translateX(30px)}}
@keyframes apR{from{transform:translateX(-30px)}}
@keyframes upS{from{transform:translateY(40px)}}
@keyframes dnS{from{transform:translateY(-40px)}}
.popin{animation:popin .6s 1s both}
@keyframes popin{from{opacity:0;transform:scale(.6)}}
.glow{animation:glw 1.2s ease-in-out infinite}
@keyframes glw{50%{opacity:.55}}
input[type=range]{width:100%;accent-color:#ff7a3d;height:30px}
.journal .reg{border:2px solid #3e2a20;border-radius:14px;padding:10px 14px;margin:10px 0;background:#1a1310}
.journal .page{background:#fff8ec;color:#2a1a12;border-radius:12px;padding:10px 14px;margin:8px 0;font-size:15px;line-height:1.5}
.journal .page h4{margin:0 0 4px;color:#b8401a;font-size:17px}
.journal .page table{border-collapse:collapse;width:100%;font-size:13px}
.journal .page td,.journal .page th{border:1px solid #c9a98a;padding:4px 6px;text-align:left}
.locked{color:var(--muted);font-style:italic}
.cert{background:linear-gradient(#fff8e6,#ffe9c4);color:#2a1a12;border:8px double #b8401a;border-radius:16px;padding:22px;text-align:center}
.cert h1{margin:4px 0;color:#b8401a;font-size:34px}
.cert .nm{font-size:36px;font-weight:900;border-bottom:3px solid #b8401a;display:inline-block;padding:0 20px;margin:8px 0}
.cert table{margin:10px auto;border-collapse:collapse;font-size:16px}
.cert td{padding:5px 14px;border-bottom:1px solid #d9b98f;text-align:left}
.codes{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.codes span{background:#2a1a12;color:#ffd166;font-weight:bold;letter-spacing:2px;padding:6px 10px;border-radius:8px;font-family:monospace;font-size:16px}
.bigcode{font-family:monospace;font-size:40px;letter-spacing:6px;color:var(--gold);background:#120c0a;border:3px solid var(--gold);display:inline-block;padding:8px 22px;border-radius:12px;margin:10px 0}
@media (max-width:640px){.logo{font-size:34px}.dlg{flex-direction:column;align-items:center}.portrait{flex:0 0 auto}.arena{grid-template-columns:1fr 1fr}.arena .mid{grid-column:1/3;grid-row:1;text-align:center}}
@media print{body{background:#fff}#app{display:none}#overlay{position:static;background:none}#panel{border:none;box-shadow:none}.noprint{display:none}}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="reg"><b id="hName">Storm Quest</b><span id="hSub">TEKS 8.10A</span></div>
    <div class="stat">HP <div class="bar"><i id="hHp" style="width:100%"></i></div></div>
    <div class="stat"><span>LVL <b id="hLvl">1</b></span><div class="bar xp"><i id="hXp" style="width:0%"></i></div></div>
    <div class="chips" id="hChips"></div>
    <div class="crys" id="hCrys" title="Sky Crystals"></div>
    <button class="hbtn" id="bJournal" title="Weather Journal">📓 Journal</button>
    <button class="hbtn" id="bSound" title="Sound">🔊</button>
    <button class="hbtn" id="bHelp" title="How to play">❓</button>
  </div>
  <div id="stage"><canvas id="cv" width="960" height="560"></canvas><div id="toast"></div></div>
  <div id="dpad">
    <div class="pad">
      <span></span><button data-k="u">▲</button><span></span>
      <button data-k="l">◀</button><span></span><button data-k="r">▶</button>
      <span></span><button data-k="d">▼</button><span></span>
    </div>
  </div>
  <div id="tip">Move with <b>Arrow keys</b> or <b>WASD</b>. Walk into people 🧑‍🔬, lab stations 🖥️, chests 🎁 and monsters 👾.</div>
</div>
<div id="overlay" class="hidden"><div id="panel"></div></div>

<script>
"use strict";
/* ================= CONTENT ================= */
const TILE=40, COLS=24, ROWS=14;

const ROOMS=[
{ key:"solar", name:"Solar Summit", sub:"The Sun’s energy · uneven heating · heat transfer", code:"SOLAR", crystal:"#ffb703",
  theme:{floor:"#d9b26f",floor2:"#d2aa66",speck:"#c09450",wall:"#5a3d1e",wallTop:"#a8743a",deco:"spike",decoC:"#9c6b3a",mtn:"#8a6a4a",cap:"#ffd166",hz:"heat",arena:"linear-gradient(#ffb703,#7a3b00)"},
  guide:{name:"Dr. Sol",coat:"#f5f5f5",shirt:"#ff9f1c",hair:"#3a2a1a",skin:"#c98b5e"},
  foes:[["Sunspot Sprite","#ffb703"],["Heat Wisp","#fb8500"],["Solar Flare Fox","#ff5d3d"]],
  map:[
"########################",
"#......#.......ll......#",
"#..G...#...E...ll...C..#",
"#......#.......ll......#",
"#......#...............#",
"#..t.......t......t....#",
"#P......lll.........S..>",
"#.......lll............>",
"#..t...............t...#",
"#......E....##.........#",
"#...........##...ll..E.#",
"#..ll.....t......ll....#",
"#..ll..................#",
"########################"],
  lesson:[
   {h:"Welcome, Sky Ranger!",b:"I’m <b>Dr. Sol</b>. The <b>Storm Tyrant</b> stole the 5 Sky Crystals and is throwing the weather out of control! To stop him, you must master <b>how the Sun, water, and air work together to make weather and climate</b>.<div class='tipbox'>📓 Every page I show you is saved in your <b>Weather Journal</b>. Open it anytime with the Journal button — it is your secret weapon in battles!</div>"},
   {h:"The Sun Powers It All",b:"The <b>Sun</b> is the main source of energy for Earth’s weather, winds, ocean currents, and water cycle.<br>• Sunlight travels through space as <b>radiation</b>.<br>• Earth’s surface <b>absorbs</b> it and warms up.<br>• The warm surface then heats the air above it."},
   {h:"Uneven Heating",b:"Sunlight does not heat Earth evenly.<br>• Near the <b>equator</b>, sunlight hits <b>directly</b> (high angle), so its energy is concentrated in a small area → <b>warmer</b>.<br>• Near the <b>poles</b>, sunlight hits at a <b>low angle</b> and spreads over a larger area → <b>colder</b>.<br>• <b>Land heats up and cools down faster than water.</b> Water needs more energy to change temperature.<div class='tipbox'>⭐ <b>STAAR Tip:</b> Uneven heating is the root cause of <b>wind</b> and <b>ocean currents</b>. They move heat from the equator toward the poles.</div>"},
   {h:"Heat Transfer in the Atmosphere",b:"<table><tr><th>Type</th><th>How it moves energy</th><th>Weather example</th></tr><tr><td><b>Radiation</b></td><td>Waves through space — no matter needed</td><td>Sunlight warming the ground</td></tr><tr><td><b>Conduction</b></td><td>Direct contact</td><td>Hot ground warming the air touching it</td></tr><tr><td><b>Convection</b></td><td>Warm, less dense fluid rises; cool, denser fluid sinks</td><td>Warm air rising to form clouds and storms</td></tr></table>"}
  ],
  qs:[
   {q:"Why are areas near the equator generally warmer than areas near the poles?",c:["Sunlight strikes the equator more directly, so energy is concentrated in a smaller area","The equator is much closer to the Sun than the poles are","The equator has more ocean water to trap heat","The poles receive no sunlight at any time of year"],a:0,e:"Direct sunlight at the equator puts more energy on each square meter. At the poles the same sunlight is <b>spread over a larger area</b>. Distance to the Sun is basically the same."},
   {q:"The diagram shows two flashlights with the same brightness. Which conclusion is best supported?",d:"sunangle",c:["Area A receives more energy per square meter than Area B","Area B receives more energy per square meter than Area A","Both areas receive the same energy per square meter","Area B is warmer because its light covers more ground"],a:0,e:"The straight-down beam (A) concentrates the same energy in a <b>smaller area</b>. This models sunlight at the <b>equator (A)</b> vs. near the <b>poles (B)</b>."},
   {q:"On a sunny morning, the hot ground warms the layer of air touching it. This is an example of —",c:["conduction","radiation","convection","condensation"],a:0,e:"Energy moving by <b>direct contact</b> between the ground and the air is <b>conduction</b>."},
   {q:"Warm air rises above a heated parking lot while cooler air sinks nearby, forming a loop. This is an example of —",c:["convection","conduction","radiation","evaporation"],a:0,e:"Warm, less dense air rising and cool, denser air sinking is a <b>convection current</b>."},
   {q:"How does energy from the Sun travel through space to reach Earth?",c:["By radiation","By conduction","By convection","By ocean currents"],a:0,e:"Space has almost no matter, so energy must travel as <b>radiation</b> (electromagnetic waves)."},
   {q:"A student measured the temperature of beach sand and ocean water during one day.<table><tr><th>Time</th><th>Sand (°C)</th><th>Ocean water (°C)</th></tr><tr><td>6 a.m.</td><td>21</td><td>24</td></tr><tr><td>2 p.m.</td><td>38</td><td>26</td></tr><tr><td>10 p.m.</td><td>19</td><td>24</td></tr></table>Which conclusion is best supported by the data?",c:["Land heats up and cools down faster than water","Water heats up faster than land","Sand and water change temperature at the same rate","The ocean was warmer than the sand all day"],a:0,e:"The sand changed by about 19°C, but the water changed only about 2°C. <b>Land heats and cools faster than water.</b>"},
   {q:"Which TWO are driven mainly by energy from the Sun?",c:["Evaporation of ocean water","Winds caused by uneven heating","Earthquakes along faults","Ocean tides","Earth’s magnetic field"],a:[0,1],multi:true,e:"The Sun powers <b>evaporation</b> and causes <b>uneven heating</b>, which creates wind. Tides are caused mainly by the Moon; earthquakes come from Earth’s interior."},
   {q:"Two cities are at the same latitude. City A is on the coast and City B is far inland. Which city most likely has milder summers and winters?",c:["City A, because nearby water heats and cools slowly","City B, because land holds heat longer than water","City B, because it is farther from ocean storms","Both, because they are at the same latitude"],a:0,e:"Water heats and cools <b>slowly</b>, so it keeps nearby air from getting very hot or very cold. Coastal climates are <b>milder</b>."},
   {q:"If the Sun heated Earth’s surface perfectly evenly, which change would most likely happen?",c:["There would be much less wind and weather movement","There would be more hurricanes","Ocean currents would move faster","The water cycle would speed up"],a:0,e:"Wind and currents come from <b>temperature and pressure differences</b> caused by uneven heating. With even heating, air would hardly move."},
   {q:"On a sunny day, the air above a dark asphalt parking lot is warmer than the air above a grassy field. What is the best explanation?",c:["The dark asphalt absorbs more of the Sun’s radiation and heats the air above it","The grass gives off heat at night","The parking lot is closer to the Sun","The air over the field contains more energy"],a:0,e:"Dark surfaces <b>absorb more radiation</b>, get hotter, and warm the air above them more (by conduction and convection)."}
  ]},

  lesson:[
   {h:"The Sun Runs the Water Cycle",b:"The <b>hydrosphere</b> is all of Earth’s water. The Sun’s energy keeps it moving:<br>1️⃣ <b>Evaporation</b> — the Sun heats water and it becomes water vapor.<br>2️⃣ <b>Condensation</b> — water vapor cools and turns into tiny droplets → <b>clouds</b>.<br>3️⃣ <b>Precipitation</b> — droplets join, get heavy, and fall as rain, snow, sleet, or hail (gravity).<br>4️⃣ <b>Collection</b> — water gathers in oceans, lakes, rivers, and groundwater."},
   {h:"Humidity & Dew Point",b:"• <b>Humidity</b> = the amount of water vapor in the air.<br>• <b>Warm air can hold more water vapor than cold air.</b><br>• <b>Dew point</b> = the temperature at which air becomes saturated and water vapor starts to <b>condense</b>.<br>When the air cools to its dew point → <b>clouds, fog, or dew</b> form."},
   {h:"How Clouds Form",b:"Air rises → it <b>expands and cools</b> → it reaches its <b>dew point</b> → water vapor <b>condenses</b> → a cloud forms.<br>Air can be forced up by: heating from the ground, mountains, or fronts.<br>• <b>Rising air</b> = clouds and rain.<br>• <b>Sinking air</b> warms up = clear skies."},
   {h:"STAAR Tip",b:"<div class='tipbox'>⭐ <b>Evaporation</b> takes in heat energy from the Sun.<br>⭐ <b>Condensation releases</b> that heat energy into the air — this released heat powers <b>thunderstorms and hurricanes</b>.<br>⭐ So the Sun, the hydrosphere, and the atmosphere are all connected!</div>"}
  ],
  qs:[
   {q:"Which water cycle process is driven MOST directly by energy from the Sun?",c:["Evaporation","Precipitation","Runoff","Infiltration"],a:0,e:"The Sun’s energy turns liquid water into water vapor — <b>evaporation</b>. Precipitation and runoff are driven by gravity."},
   {q:"Water droplets form on the outside of a glass of ice-cold lemonade on a humid day. Why?",c:["Water vapor in the air cools to its dew point and condenses on the glass","Lemonade leaks through the glass","The ice melts and moves through the glass","Warm air pulls water out of the lemonade"],a:0,e:"The cold glass cools nearby air to its <b>dew point</b>, so water vapor <b>condenses</b> into droplets — the same thing that makes clouds and dew."},
   {q:"At noon, the air temperature is 30°C and the dew point is 18°C. Overnight, the air temperature drops to 18°C. What will most likely form?",c:["Dew or fog, because the air reached its dew point","Nothing, because the dew point is too low","Hail, because the air is cold","A drought, because the air dried out"],a:0,e:"When the air temperature drops to the <b>dew point</b>, the air is saturated and water vapor condenses into <b>dew or fog</b>."},
   {q:"What happens to a pocket of warm, moist air as it rises higher in the atmosphere?",c:["It expands and cools, and clouds can form if it reaches its dew point","It shrinks and warms up","It gains more water vapor and becomes heavier","It stays the same temperature"],a:0,e:"Rising air <b>expands and cools</b>. If it cools to its dew point, water vapor condenses and a <b>cloud</b> forms."},
   {q:"Which TWO conditions make clouds most likely to form?",c:["Warm, moist air rising","Air cooling to its dew point","Dry air sinking","A strong high-pressure system overhead","Air temperature far above the dew point"],a:[0,1],multi:true,e:"Clouds need <b>rising air</b> that <b>cools to its dew point</b>. Sinking air and high pressure warm the air and keep skies clear."},
   {q:"Hot, humid summer afternoons in Texas often end with thunderstorms. Which explanation is best?",c:["The Sun heats the ground, warm moist air rises, cools, and condenses into tall storm clouds","Cold air from the ocean rises in the afternoon","The Moon pulls water vapor up into the sky","Humid air is heavier, so it sinks and makes rain"],a:0,e:"The Sun heats the ground → warm, moist air rises (convection) → it cools and condenses, <b>releasing heat</b> that makes the cloud grow into a thunderstorm."},
   {q:"When water vapor condenses into cloud droplets, what happens to energy?",c:["Heat energy is released into the surrounding air","Heat energy is absorbed from the air","No energy change happens","The energy is sent back to the Sun"],a:0,e:"Condensation <b>releases</b> the heat that was absorbed during evaporation. That heat fuels storms."},
   {q:"The amount of water vapor in the air stays the same, but the temperature drops from 25°C in the afternoon to 15°C at night. What happens to the relative humidity?",c:["It increases, because cooler air can hold less water vapor","It decreases, because there is less water vapor","It stays exactly the same","It drops to zero"],a:0,e:"Cold air can hold <b>less</b> water vapor, so the same amount of vapor makes the air <b>closer to saturated</b> — relative humidity goes up."},
   {q:"Which sequence correctly shows how rain forms from ocean water?",c:["Sun heats ocean → evaporation → vapor rises and cools → condensation → droplets combine → precipitation","Precipitation → evaporation → condensation → Sun heats ocean","Condensation → Sun heats ocean → precipitation → evaporation","Sun heats ocean → precipitation → condensation → evaporation"],a:0,e:"Energy from the Sun starts it: <b>evaporation → rising & cooling → condensation → droplets grow → precipitation</b>."},
   {q:"A region has air slowly sinking from high in the atmosphere. What weather is most likely?",c:["Clear, dry skies, because sinking air warms and clouds cannot form","Heavy rain, because sinking air cools","Thunderstorms, because the air is rising quickly","Fog, because sinking air reaches the dew point"],a:0,e:"Sinking air is compressed and <b>warms</b>, moving it away from its dew point — so clouds <b>evaporate</b> and skies are clear."}
  ]},

  lesson:[
   {h:"Air Pressure",b:"<b>Air pressure</b> = the weight of the air pushing down on Earth’s surface.<br>• <b>Warm air</b> is less dense → it <b>rises</b> → <b>LOW pressure</b> at the surface → clouds, rain, storms.<br>• <b>Cool air</b> is denser → it <b>sinks</b> → <b>HIGH pressure</b> → clear, calm, dry weather.<div class='tipbox'>🗺️ On a weather map: <b style='color:#1f4f8a'>H</b> = high pressure (fair weather). <b style='color:#c0392b'>L</b> = low pressure (stormy weather). A <b>falling barometer</b> means a storm may be coming.</div>"},
   {h:"What Makes Wind?",b:"<b>Wind</b> is air moving from <b>HIGH pressure</b> toward <b>LOW pressure</b>.<br>• The bigger the pressure difference, the <b>stronger</b> the wind.<br>• Pressure differences come from <b>uneven heating</b> by the Sun.<br>So the Sun → uneven heating → pressure differences → wind!"},
   {h:"Sea Breeze & Land Breeze",b:"<b>Daytime — Sea Breeze:</b> Land heats faster than water. Warm air over the land rises (low pressure). Cooler, higher-pressure air over the water flows <b>from the sea to the land</b>.<br><br><b>Nighttime — Land Breeze:</b> Land cools faster than water. Now the air over the land is cooler (higher pressure), so the breeze blows <b>from the land to the sea</b>.<div class='tipbox'>⭐ A sea breeze is a perfect STAAR example of the <b>Sun, hydrosphere, and atmosphere interacting</b>!</div>"}
  ],
  qs:[
   {q:"The diagram shows a beach on a sunny afternoon. In which direction will the wind most likely blow near the ground?",d:"breeze",c:["From the ocean toward the land","From the land toward the ocean","Straight up from the ocean","There will be no wind"],a:0,e:"The hot land heats the air above it, which rises (<b>low pressure</b>). Cooler, higher-pressure air over the ocean moves in: a <b>sea breeze</b>."},
   {q:"Why does a land breeze usually blow at night?",c:["The land cools faster than the water, so the cooler air over land flows toward the sea","The water cools faster than the land","The Moon pulls the air toward the ocean","Warm air over the land sinks at night"],a:0,e:"At night, land <b>cools faster</b>. Cooler, denser air over the land has higher pressure, so air flows from the land toward the warmer sea."},
   {q:"Wind always blows —",c:["from areas of high pressure to areas of low pressure","from areas of low pressure to areas of high pressure","from cold oceans to warm oceans only","from the poles to the Moon"],a:0,e:"Air moves from <b>high pressure to low pressure</b>, just like air rushing out of a balloon."},
   {q:"A weather map shows a large red L over Dallas. What weather should Dallas most likely expect?",c:["Clouds and rain, because air is rising","Clear skies, because air is sinking","Calm, dry weather all week","Freezing temperatures, because L means low temperature"],a:0,e:"<b>L</b> means <b>low pressure</b> — air is rising, cooling, and forming clouds and precipitation. (It means low pressure, not low temperature!)"},
   {q:"Why do high-pressure systems usually bring clear skies?",c:["Sinking air warms and prevents clouds from forming","Rising air cools and forms clouds","High pressure pushes clouds into space","High pressure only forms over oceans"],a:0,e:"In a high, air <b>sinks and warms</b>, moving away from its dew point, so clouds don’t form."},
   {q:"A barometer at a weather station recorded these readings.<table><tr><th>Time</th><th>Air pressure (mb)</th></tr><tr><td>9 a.m.</td><td>1018</td></tr><tr><td>12 p.m.</td><td>1010</td></tr><tr><td>3 p.m.</td><td>1002</td></tr><tr><td>6 p.m.</td><td>995</td></tr></table>What is the best prediction?",c:["Stormy weather is approaching","Clear, calm weather is approaching","The temperature will stay exactly the same","A high-pressure system is moving in"],a:0,e:"Steadily <b>falling pressure</b> means a <b>low-pressure system</b> is moving in — clouds, wind, and storms are likely."},
   {q:"When air near the ground is heated by the Sun, which TWO things happen?",c:["The air becomes less dense","The air rises, lowering the pressure at the surface","The air sinks toward the ground","The air pressure at the surface increases","The air becomes denser"],a:[0,1],multi:true,e:"Heated air becomes <b>less dense</b> and <b>rises</b>, leaving <b>lower pressure</b> at the surface."},
   {q:"The table shows air pressure in four pairs of cities that are each 200 km apart.<table><tr><th>Pair</th><th>City 1 (mb)</th><th>City 2 (mb)</th></tr><tr><td>A</td><td>1030</td><td>990</td></tr><tr><td>B</td><td>1012</td><td>1008</td></tr><tr><td>C</td><td>1015</td><td>1005</td></tr><tr><td>D</td><td>1020</td><td>1018</td></tr></table>Between which pair will the wind most likely be strongest?",c:["Pair A","Pair B","Pair C","Pair D"],a:0,e:"Pair A has the <b>biggest pressure difference</b> (40 mb), so air rushes between them fastest."},
   {q:"What is the root cause of almost all wind on Earth?",c:["Uneven heating of Earth’s surface by the Sun","The rotation of the Moon","Ocean waves pushing air","Volcanic eruptions"],a:0,e:"Uneven heating → temperature differences → <b>pressure differences</b> → wind."},
   {q:"On a hot afternoon, a large parking lot sits next to a lake. Over which area is the air pressure most likely lower, and why?",c:["Over the parking lot, because the warmer air there rises","Over the lake, because water makes air heavier","Over the lake, because the air there is cooler","The pressure is equal everywhere"],a:0,e:"The parking lot heats up faster, warming the air above it. Warm air <b>rises</b>, creating <b>lower pressure</b>. A breeze will blow from the lake toward the lot."}
  ]},

  lesson:[
   {h:"Air Masses",b:"An <b>air mass</b> is a huge body of air with about the same <b>temperature and humidity</b>. It takes on the traits of where it forms.<br><table><tr><th>Letter</th><th>Means</th><th>Traits</th></tr><tr><td>m (maritime)</td><td>forms over water</td><td>humid</td></tr><tr><td>c (continental)</td><td>forms over land</td><td>dry</td></tr><tr><td>T (tropical)</td><td>forms near the equator</td><td>warm</td></tr><tr><td>P (polar)</td><td>forms near the poles</td><td>cold</td></tr></table><b>mT</b> from the Gulf of Mexico brings Texas its warm, humid air. <b>cP</b> from Canada brings cold, dry “blue northers.”"},
   {h:"Cold Fronts",b:"A <b>front</b> is the boundary where two air masses meet.<br><b>Cold front</b> (blue triangles ▲): dense cold air pushes <b>under</b> warm air and forces it up <b>quickly</b>.<br>• Tall cumulonimbus clouds, <b>thunderstorms</b>, heavy rain, gusty winds<br>• Afterward: <b>cooler, drier, clearer</b> weather"},
   {h:"Warm, Stationary & Occluded Fronts",b:"<b>Warm front</b> (red half-circles ◗): warm air slides <b>gently up over</b> cold air.<br>• Layered stratus clouds, <b>light, steady rain</b> for a long time<br>• Afterward: <b>warmer and more humid</b><br><br><b>Stationary front</b>: neither air mass moves → <b>days</b> of clouds and rain in one place.<br><b>Occluded front</b>: a fast cold front <b>catches up</b> to a warm front and lifts the warm air off the ground → clouds and precipitation."},
   {h:"STAAR Tip",b:"<div class='tipbox'>⭐ <b>Cold front = quick & violent</b> (storms, then cooler).<br>⭐ <b>Warm front = slow & steady</b> (drizzle, then warmer).<br>⭐ Fronts are where warm, moist air is <b>forced to rise</b> — and rising air makes clouds and rain!</div>"}
  ],
  qs:[
   {q:"The diagram shows two air masses meeting. What type of front is shown, and what weather will it most likely bring?",d:"coldfront",c:["A cold front — thunderstorms, then cooler and drier air","A warm front — light drizzle, then warmer air","A stationary front — clear skies for a week","An occluded front — no clouds at all"],a:0,e:"Cold, dense air is <b>wedging under</b> warm air and forcing it up steeply. That makes tall storm clouds — a <b>cold front</b>."},
   {q:"An air mass that forms over the Gulf of Mexico in summer will most likely be —",c:["warm and humid","cold and dry","warm and dry","cold and humid"],a:0,e:"Over warm <b>water</b> near the tropics = <b>maritime tropical (mT)</b>: warm and humid."},
   {q:"An air mass that forms over northern Canada in winter will most likely be —",c:["cold and dry","warm and humid","cold and humid","warm and dry"],a:0,e:"Over cold <b>land</b> near the pole = <b>continental polar (cP)</b>: cold and dry."},
   {q:"In one hour, a town’s temperature drops 15°F, strong gusty winds blow, and a heavy thunderstorm passes. Then skies clear and the air feels cool and dry. What most likely passed through?",c:["A cold front","A warm front","A stationary front","A high-pressure system with no front"],a:0,e:"A sudden temperature drop, storms, then clear cool air is the signature of a <b>cold front</b>."},
   {q:"A city has several days of light, steady drizzle and gray layered clouds. Afterward, the weather becomes warmer and more humid. What most likely passed through?",c:["A warm front","A cold front","An occluded front","A continental polar air mass"],a:0,e:"Slow, steady precipitation followed by <b>warmer, more humid</b> air is the signature of a <b>warm front</b>."},
   {q:"Why do cold fronts often cause thunderstorms?",c:["Dense cold air forces warm, moist air to rise quickly, cool, and condense into tall clouds","Warm air sinks rapidly over cold air","Cold air contains more water vapor than warm air","Cold fronts move too slowly for clouds to form"],a:0,e:"The cold air acts like a <b>wedge</b>, shoving warm, moist air <b>up fast</b>. It cools and condenses into tall cumulonimbus clouds."},
   {q:"Which TWO statements about a stationary front are true?",c:["Neither air mass is moving much","It can bring several days of clouds and precipitation to one area","It always produces tornadoes","It quickly clears the skies","It can only form over oceans"],a:[0,1],multi:true,e:"At a <b>stationary front</b>, the air masses stall, so clouds and rain can sit over one area for <b>days</b>."},
   {q:"A weather map shows a line of blue triangles moving east toward Austin. What should people in Austin expect soon?",c:["Storms as the front arrives, then cooler temperatures","A long period of light drizzle, then warmer air","Days of unchanging weather","Hotter, more humid weather with no storms"],a:0,e:"Blue triangles = a <b>cold front</b>. Expect a line of storms, then <b>cooler, drier</b> air behind it."},
   {q:"Texas summers are often hot and humid. Which air mass is most responsible?",c:["Maritime tropical (mT) air from the Gulf of Mexico","Continental polar (cP) air from Canada","Maritime polar (mP) air from the North Pacific","Continental tropical (cT) air only"],a:0,e:"<b>mT air</b> forms over the warm Gulf of Mexico and carries <b>warm, moist</b> air into Texas."},
   {q:"How does an occluded front form?",c:["A faster cold front catches up to a warm front and lifts the warm air off the ground","A warm front stops moving for several days","Two warm air masses collide over the ocean","Cold air rises over warm air"],a:0,e:"Cold fronts move faster than warm fronts. When one <b>catches up</b>, the warm air between them is lifted completely off the ground — an <b>occluded front</b>."}
  ]},

  lesson:[
   {h:"Weather vs. Climate",b:"• <b>Weather</b> = the conditions of the atmosphere at one place and time (today’s rain, this week’s cold front). It changes day to day.<br>• <b>Climate</b> = the <b>average</b> weather of a place over a <b>long time</b> (30+ years).<div class='tipbox'>“It snowed in Dallas yesterday” = weather. “Dallas has hot summers and mild winters” = climate.</div>"},
   {h:"Oceans Store and Move Heat",b:"Water absorbs a lot of the Sun’s energy and releases it slowly.<br>• <b>Ocean currents</b> carry <b>warm water from the equator toward the poles</b> and cold water back toward the equator.<br>• The warm <b>Gulf Stream</b> keeps Western Europe much milder than places at the same latitude in Canada.<br>• The cold <b>California Current</b> keeps the California coast cool in summer."},
   {h:"Climate Factors",b:"<table><tr><th>Factor</th><th>Effect</th></tr><tr><td><b>Latitude</b></td><td>Closer to the equator = more direct sunlight = warmer</td></tr><tr><td><b>Nearby water</b></td><td>Milder temperatures, smaller temperature range</td></tr><tr><td><b>Elevation</b></td><td>Higher = colder</td></tr><tr><td><b>Ocean currents</b></td><td>Warm currents warm coasts; cold currents cool them</td></tr><tr><td><b>Mountains</b></td><td>Rain shadow: wet windward side, dry leeward side</td></tr></table>"},

function shade(hex,amt){let c=hex.replace("#","");if(c.length===3)c=c.split("").map(x=>x+x).join("");const n=parseInt(c,16);let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}

function loadRoom(i){
 S.room=i;const reg=ROOMS[i];
 const grid=reg.map.map(r=>(r+"#".repeat(COLS)).slice(0,COLS).split(""));
 R={reg,grid,enemies:[],guideDone:!!reg.final,stationDone:!!reg.final,killed:0,total:0,gateOpen:false,pool:shuffle(reg.qs.slice()),boss:null};
 let fi=0;
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
  const ch=grid[y][x];
  if(ch==="P"){P.x=x*TILE+TILE/2;P.y=y*TILE+TILE/2;grid[y][x]="."}
  if(ch==="E"){const f=reg.foes[fi%reg.foes.length];R.enemies.push({x:x*TILE+TILE/2,y:y*TILE+TILE/2,w:26,h:26,vx:0,vy:0,t:0,name:f[0],color:f[1],k:fi,hp:3,max:3,ph:Math.random()*6});fi++;grid[y][x]="."}
  if(ch==="B"){R.boss={x:x*TILE+TILE/2,y:y*TILE+TILE/2,hp:10,max:10}}
 }
 R.total=R.enemies.length;

 else {toast("⚠️ The Storm Tyrant awaits… Walk up to him when you’re ready!",4000);sfx("rumble")}
}
function isSolid(tx,ty,isP){
 if(ty<0||ty>=ROWS)return true;
 if(tx>=COLS)return !(isP&&R.gateOpen);
 if(tx<0)return true;
 const ch=R.grid[ty][tx];
 if(ch===">")return !(isP&&R.gateOpen);
 return "#wlmtGSCcB".includes(ch);
}
function moveEnt(e,mx,my,isP){
 const nx=e.x+mx,ny=e.y+my,hw=e.w/2,hh=e.h/2;
 const pts=[[nx-hw,ny-hh],[nx+hw,ny-hh],[nx-hw,ny+hh],[nx+hw,ny+hh]];
 for(const [px,py] of pts){const tx=Math.floor(px/TILE),ty=Math.floor(py/TILE);
  if(isSolid(tx,ty,isP)){if(isP)bump(tx,ty);return false}}
 e.x=nx;e.y=ny;return true;
}
function bump(tx,ty){
 if(S.bumpCD>0||S.paused)return;
 const ch=(R.grid[ty]||[])[tx];
 if(ch==="G"){S.bumpCD=30;openGuide()}
 else if(ch==="S"){S.bumpCD=30;if(R.stationDone)toast("✅ Lab complete! "+(R.killed<R.total?"Now defeat the monsters.":""));else openStation()}
 else if(ch==="C"){S.bumpCD=30;openChest(tx,ty)}
 else if(ch==="B"){S.bumpCD=30;openBoss()}
 else if(ch===">"&&!R.gateOpen){S.bumpCD=90;const need=[];if(!R.guideDone)need.push("talk to "+R.reg.guide.name);if(!R.stationDone)need.push("finish the lab station");if(R.killed<R.total)need.push(`defeat ${R.total-R.killed} more monster${R.total-R.killed>1?"s":""}`);toast("🔒 Gate locked! You still need to: "+need.join(", "),3500);sfx("bad")}
}

function startBattle(en,isBoss){
 S.paused=true;sfx("battle");
 B={en,isBoss,scan:isBoss?2:1,q:null,order:null,picked:[],answered:false};
 nextQ();
}
function nextQ(){
 if(!R.pool.length)R.pool=shuffle(R.reg.qs.slice());
 B.q=R.pool.shift();B.order=shuffle(B.q.c.map((t,i)=>({t,i})));B.picked=[];B.answered=false;
 renderBattle();
}
function renderBattle(){
 const en=B.en,q=B.q,isB=B.isBoss;const multi=!!q.multi;const need=multi?q.a.length:1;
 const foeName=isB?"👑 THE STORM TYRANT":en.name;const art=isB?bossSVG(200):monsterSVG(en.color,en.k,150);
 const html=`<div class="arena" id="arena" style="background:${R.reg.theme.arena}">
  <div class="fighter"><b>🧑‍🚀 ${esc(S.name||"Sky Ranger")}</b>HP <span id="php">${S.hp}/${S.maxhp}</span><div class="bar"><i id="phb" style="width:${S.hp/S.maxhp*100}%"></i></div>${S.shield?"<div>🛡️ Cloud Shield ready</div>":""}<div class="streak">${S.streak>=1?"🔥 Streak: "+S.streak+(S.streak%3===2?" — next hit is CRITICAL!":""):""}</div></div>
  <div class="mid"><div class="mon" id="mon">${art}</div></div>
  <div class="fighter foe"><b>${foeName}</b>HP <span id="ehp">${en.hp}/${en.max}</span><div class="bar foehp"><i id="ehb" style="width:${en.hp/en.max*100}%"></i></div><div style="font-size:12px;margin-top:4px;color:#ffd9c7">${isB?"Final Boss · STAAR Level":"Level "+(S.room+1)+" monster"}</div></div>
 </div>
 <div class="qcard"><div class="qmeta"><span>${isB?"⚔️ Boss Question":"⚡ STAAR Challenge"}</span><span>${multi?"Select TWO answers":"Select ONE answer"}</span></div>
  <div class="qtext">${q.q}</div>${q.d?`<div class="diag">${DIAG[q.d]()}</div>`:""}
  <div class="choices">${B.order.map((o,j)=>`<button class="choice" data-i="${o.i}" data-j="${j}"><span class="lt">${"ABCDE"[j]}</span><span>${o.t}</span></button>`).join("")}</div>
  <div class="qact"><button class="scan" id="scan" ${B.scan<1||multi?"disabled":""} title="Removes one wrong answer">📡 Radar Scan (${B.scan} left)</button>${multi?`<button class="btn" id="sub" disabled>Submit (0/${need})</button>`:""}<span style="font-size:13px;color:#7a5a3a">Keys: A–E to pick${multi?", Enter to submit":""}</span></div>
  <div class="fb" id="fb"></div></div>`;
 showPanel(html);
 const pick=b=>{if(B.answered||b.disabled)return;const i=+b.dataset.i;
  if(!multi){B.picked=[i];answer();return}
  if(B.picked.includes(i)){B.picked=B.picked.filter(x=>x!==i);b.classList.remove("picked")}
  else{if(B.picked.length>=need)return;B.picked.push(i);b.classList.add("picked")}
  sfx("tap");const sb=$("#sub");sb.disabled=B.picked.length!==need;sb.textContent=`Submit (${B.picked.length}/${need})`};
 document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>pick(b));
 if(multi)$("#sub").onclick=()=>{if(B.picked.length===need)answer()};
 $("#scan").onclick=()=>{if(B.scan<1||B.answered)return;const wrong=[...document.querySelectorAll(".choice")].filter(b=>!b.disabled&&+b.dataset.i!==q.a);if(!wrong.length)return;const w=wrong[Math.floor(Math.random()*wrong.length)];w.disabled=true;w.classList.add("gone");B.scan--;sfx("tap");$("#scan").textContent=`📡 Radar Scan (${B.scan} left)`;if(B.scan<1)$("#scan").disabled=true};
 battleKeys=k=>{if(B.answered){if(k==="enter"||k===" ")$("#cont")&&$("#cont").click();return}
  const idx="abcde".indexOf(k);if(idx>=0){const b=document.querySelector(`.choice[data-j="${idx}"]`);if(b)pick(b)}
  if(k==="enter"&&multi&&B.picked.length===need)answer()};
}
function answer(){
 B.answered=true;const q=B.q,multi=!!q.multi;S.attempts++;
 const correctSet=multi?q.a.slice().sort().join():String(q.a);
 const ok=B.picked.slice().sort().join()===correctSet;
 document.querySelectorAll(".choice").forEach(b=>{b.disabled=true;const i=+b.dataset.i;const isC=multi?q.a.includes(i):i===q.a;if(isC)b.classList.add("correct");else if(B.picked.includes(i))b.classList.add("wrong")});
 const sb=$("#sub");if(sb)sb.style.display="none";
 const arena=$("#arena"),fb=$("#fb");
 let head="",after="";
 if(ok){S.correct++;S.streak++;S.best=Math.max(S.best,S.streak);const crit=S.streak%3===0;const dmg=crit?2:1;B.en.hp=Math.max(0,B.en.hp-dmg);
  sfx(crit?"crit":"hit");setTimeout(()=>sfx("good"),120);$("#mon").classList.add("hit");
  const d=document.createElement("div");d.className="dmg";d.style.left="50%";d.style.top="30%";d.textContent=crit?"CRITICAL -2!":"-1";arena.appendChild(d);
  head=crit?"💥 CRITICAL HIT! 3 in a row!":["🎯 Direct hit!","✅ Correct!","⚡ Nailed it!","🔥 Great science!"][Math.floor(Math.random()*4)];
  gainXP(crit?20:10);
 }else{S.streak=0;S.missed.push(q.q.replace(/<[^>]+>/g," ").replace(/\s+/g," ").slice(0,110));R.pool.push(q);
  arena.insertAdjacentHTML("beforeend",`<div class="flash"></div>`);arena.classList.add("shake");
  if(S.shield){S.shield=0;head="🛡️ Your Cloud Shield blocked the damage!";sfx("hit")}
  else{const dmg=B.isBoss?25:20;S.hp=Math.max(0,S.hp-dmg);head=`💢 Ouch! −${dmg} HP`;sfx("bad")}
  after=`<div style="margin-top:6px;font-size:14px">📓 Tip: check your Weather Journal for this topic. You’ll see this question again later!</div>`;
 }
 updateHUD();
 $("#php").textContent=S.hp+"/"+S.maxhp;$("#phb").style.width=(S.hp/S.maxhp*100)+"%";$("#ehp").textContent=B.en.hp+"/"+B.en.max;$("#ehb").style.width=(B.en.hp/B.en.max*100)+"%";
 const done=B.en.hp<=0,dead=S.hp<=0;
 fb.className="fb "+(ok?"good":"bad");
 fb.innerHTML=`<b class="h">${head}</b>${ok?"":"<b>Correct answer shown in green.</b> "}${q.e}${after}<div style="margin-top:10px"><button class="btn ${ok?"green":""}" id="cont">${done?"Finish them! ▶":dead?"Continue":"Next question ▶"}</button></div>`;
 $("#cont").onclick=()=>{
  if(done){winBattle()}
  else if(dead){loseBattle()}
  else nextQ();
 };
 fb.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function winBattle(){
 const en=B.en;
 if(B.isBoss){sfx("win");finale();return}
 R.enemies=R.enemies.filter(e=>e!==en);R.killed++;gainXP(25);sfx("win");
 const heal=Math.min(S.maxhp-S.hp,15);S.hp+=heal;updateHUD();
 showPanel(`<div class="center"><h2>🏆 ${en.name} defeated!</h2><div style="opacity:.5;transform:rotate(15deg);display:inline-block">${monsterSVG(en.color,en.k,110)}</div><p style="font-size:18px">+25 XP ${heal>0?"· +"+heal+" HP":""}<br>Monsters left in this region: <b>${R.total-R.killed}</b></p><button class="btn green" id="ok">Back to exploring</button></div>`,()=>{$("#ok").onclick=()=>{closePanel();S.inv=90;checkGate()}});
}
function loseBattle(){
 sfx("lose");B.en.hp=B.en.max;
 showPanel(`<div class="center"><h2>😵 Knocked out!</h2><p style="font-size:18px">The ${B.isBoss?"Storm Tyrant":B.en.name} was too strong this time.<br>You’ve been sent back to the start of <b>${R.reg.name}</b> with full HP.</p><div class="tipbox" style="color:#2a1a12;text-align:left">💡 Open your <b>📓 Weather Journal</b> and review before you battle again. Read every answer choice carefully — STAAR loves tricky distractors!</div><br><button class="btn" id="ok">Try again</button></div>`,()=>{$("#ok").onclick=()=>{S.hp=S.maxhp;const reg=R.reg;for(let y=0;y<ROWS;y++){const x=reg.map[y].indexOf("P");if(x>=0){P.x=x*TILE+TILE/2;P.y=y*TILE+TILE/2}}if(R.boss)R.boss.hp=R.boss.max;closePanel();S.inv=120;updateHUD()}});
}

 showPanel(`<div class="dlg"><div class="portrait">${bossSVG(130)}<div>The Storm Tyrant</div></div><div class="bubble"><h3>“So… you collected all 5 crystals.”</h3>Foolish Sky Ranger! I am the <b>Storm Tyrant</b>, ruler of thunder, fronts, and hurricanes. My questions are as hard as the <b>STAAR</b> itself. Answer <b>10</b> correctly to shatter my crown… if you can!<div class="tipbox">⚔️ Boss rules: wrong answers do <b>25 damage</b>. You get <b>2 Radar Scans</b>. Three correct in a row = <b>CRITICAL HIT</b>.</div></div></div><div class="center" style="margin-top:12px"><button class="btn" id="go">⚔️ Battle the Storm Tyrant!</button></div>`,()=>{$("#go").onclick=()=>{sfx("rumble");startBattle(R.boss,true)}});

/* ================= UPDATE ================= */
function update(dt){
 frame++;
 if(S.bumpCD>0)S.bumpCD-=dt;
 if(S.paused||!R)return;
 if(S.inv>0)S.inv-=dt;
 let dx=0,dy=0;
 if(keys.arrowleft||keys.a||touch.l)dx--;if(keys.arrowright||keys.d||touch.r)dx++;
 if(keys.arrowup||keys.w||touch.u)dy--;if(keys.arrowdown||keys.s||touch.d)dy++;
 if(dx&&dy){dx*=.707;dy*=.707}
 const sp=3.3*dt;P.moving=!!(dx||dy);
 if(dx)P.dir=dx>0?1:-1;
 if(P.moving)P.anim+=dt*.25;
 moveEnt(P,dx*sp,0,true);moveEnt(P,0,dy*sp,true);
 if(R.gateOpen&&P.x>COLS*TILE-6){if(S.room<ROOMS.length-1){loadRoom(S.room+1)}return}
 for(const e of R.enemies){
  e.t-=dt;e.ph+=dt*.08;
  if(e.t<=0){const r=Math.random();const dirs=[[1,0],[-1,0],[0,1],[0,-1],[0,0]];const d=dirs[Math.floor(r*5)];
   const tx=P.x-e.x,ty=P.y-e.y,dist=Math.hypot(tx,ty);
   if(dist<160&&Math.random()<.5){e.vx=Math.sign(tx)*(Math.abs(tx)>Math.abs(ty)?1:0);e.vy=Math.sign(ty)*(Math.abs(ty)>=Math.abs(tx)?1:0)}else{e.vx=d[0];e.vy=d[1]}
   e.t=40+Math.random()*60}
  const es=1.1*dt;if(!moveEnt(e,e.vx*es,0,false))e.vx*=-1;if(!moveEnt(e,0,e.vy*es,false))e.vy*=-1;
  if(S.inv<=0&&Math.hypot(P.x-e.x,P.y-e.y)<28){startBattle(e,false);break}
 }
}

/* ================= DRAW ================= */
function hash(x,y){let h=(x*374761393+y*668265263)^0x5bd1e995;h=(h^(h>>>13))*1274126177;return ((h^(h>>>16))>>>0)/4294967295}
function drawFloor(x,y,th){const px=x*TILE,py=y*TILE;ctx.fillStyle=(x+y)%2?th.floor:th.floor2;ctx.fillRect(px,py,TILE,TILE);ctx.fillStyle=th.speck;
 for(let i=0;i<3;i++){const hx=hash(x*3+i,y),hy=hash(y*5+i,x);ctx.fillRect(px+hx*36,py+hy*36,3,3)}}
function drawTile(ch,x,y,t,th){
 const px=x*TILE,py=y*TILE;
 if(ch==="#"){ctx.fillStyle=th.wall;ctx.fillRect(px,py,TILE,TILE);ctx.fillStyle=th.wallTop;ctx.fillRect(px,py,TILE,8);ctx.fillStyle="rgba(0,0,0,.25)";ctx.fillRect(px+(y%2?0:20),py+20,2,20);ctx.fillRect(px,py+20,TILE,2);return}
 if(ch==="w"){ctx.fillStyle="#1f6fb5";ctx.fillRect(px,py,TILE,TILE);ctx.strokeStyle="rgba(255,255,255,.28)";ctx.lineWidth=2;const o=Math.sin(t/30+x+y)*4;ctx.beginPath();ctx.moveTo(px+6,py+14+o);ctx.quadraticCurveTo(px+14,py+8+o,px+22,py+14+o);ctx.moveTo(px+18,py+30-o);ctx.quadraticCurveTo(px+26,py+24-o,px+34,py+30-o);ctx.stroke();return}
 if(ch==="l"){const hz=th.hz||"lava";
  if(hz==="storm"){drawFloor(x,y,th);ctx.fillStyle="#5c6474";ctx.beginPath();ctx.arc(px+12,py+20,11,0,7);ctx.arc(px+26,py+18,13,0,7);ctx.arc(px+20,py+10,10,0,7);ctx.fill();if((Math.floor(t/5)+x*3+y*7)%23===0){ctx.strokeStyle="#ffd166";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(px+20,py+26);ctx.lineTo(px+15,py+34);ctx.lineTo(px+22,py+34);ctx.lineTo(px+17,py+42);ctx.stroke()}else{ctx.strokeStyle="#5fa8d3";ctx.lineWidth=2;ctx.beginPath();const o=(t/2+x*5)%8;ctx.moveTo(px+12,py+30+o);ctx.lineTo(px+10,py+36+o);ctx.moveTo(px+26,py+30+o);ctx.lineTo(px+24,py+36+o);ctx.stroke()}return}
  if(hz==="ice"){ctx.fillStyle="#bde0fe";ctx.fillRect(px,py,TILE,TILE);ctx.strokeStyle="rgba(255,255,255,.8)";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(px+6,py+30);ctx.lineTo(px+18,py+10);ctx.moveTo(px+22,py+34);ctx.lineTo(px+34,py+16);ctx.stroke();return}
  if(hz==="heat"){ctx.fillStyle="#e07a2f";ctx.fillRect(px,py,TILE,TILE);const g2=.5+.5*Math.sin(t/12+x+y);ctx.strokeStyle=`rgba(255,230,150,${.3+g2*.4})`;ctx.lineWidth=2;ctx.beginPath();for(let k=0;k<3;k++){const yy=py+10+k*10;ctx.moveTo(px+4,yy);ctx.quadraticCurveTo(px+14,yy-5+g2*3,px+20,yy);ctx.quadraticCurveTo(px+28,yy+5-g2*3,px+36,yy)}ctx.stroke();return}
  ctx.fillStyle="#d8400f";ctx.fillRect(px,py,TILE,TILE);const g=.5+.5*Math.sin(t/20+x*1.7+y);ctx.fillStyle=`rgba(255,200,60,${.35+g*.4})`;ctx.beginPath();ctx.arc(px+12+hash(x,y)*14,py+14,6+g*3,0,7);ctx.arc(px+26,py+28-hash(y,x)*8,5+g*2,0,7);ctx.fill();return}
 drawFloor(x,y,th);
 if(ch==="f"){if(R.reg.key==="front"){ctx.strokeStyle="#1f4f8a";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+40,py+40);ctx.stroke();ctx.fillStyle=(x%2)?"#1f4f8a":"#c0392b";ctx.beginPath();if(x%2){ctx.moveTo(px+12,py+12);ctx.lineTo(px+28,py+28);ctx.lineTo(px+28,py+10)}else{ctx.arc(px+20,py+20,9,-Math.PI*.75,Math.PI*.25)}ctx.fill();return}ctx.strokeStyle="#2a1a10";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+14,py+18);ctx.lineTo(px+22,py+16);ctx.lineTo(px+40,py+40);ctx.stroke();return}
 if(ch==="m"){ctx.fillStyle=th.mtn;ctx.beginPath();ctx.moveTo(px-2,py+TILE);ctx.lineTo(px+20,py-6);ctx.lineTo(px+42,py+TILE);ctx.fill();ctx.fillStyle=th.cap;ctx.beginPath();ctx.moveTo(px+13,py+6);ctx.lineTo(px+20,py-6);ctx.lineTo(px+27,py+6);ctx.fill();return}
 if(ch==="t"){drawDeco(px,py,th);return}
 if(ch==="G"){drawPerson(px+20,py+22,R.reg.guide,1,0);if(!R.guideDone){const b=Math.sin(t/8)*3;ctx.fillStyle="#ffd166";ctx.beginPath();ctx.arc(px+20,py-8+b,10,0,7);ctx.fill();ctx.fillStyle="#2a1a12";ctx.font="bold 16px Verdana";ctx.textAlign="center";ctx.fillText("!",px+20,py-2+b)}return}
 if(ch==="S"){ctx.fillStyle="#2b2f3a";ctx.fillRect(px+4,py+8,32,30);ctx.fillStyle="#1b1e26";ctx.fillRect(px+4,py+32,32,6);const g=.6+.4*Math.sin(t/12);ctx.fillStyle=R.stationDone?"#2fd47a":`rgba(80,220,255,${g})`;ctx.fillRect(px+8,py+12,24,16);ctx.fillStyle="#0b0b0b";ctx.font="bold 12px Verdana";ctx.textAlign="center";ctx.fillText(R.stationDone?"✓":"LAB",px+20,py+24);if(!R.stationDone){ctx.fillStyle="#ffd166";ctx.font="bold 16px Verdana";ctx.fillText("?",px+20,py+4+Math.sin(t/8)*3)}return}
 if(ch==="C"||ch==="c"){ctx.fillStyle="#7a4a1e";ctx.fillRect(px+7,py+16,26,18);ctx.fillStyle=ch==="C"?"#9b5e28":"#3a2410";ctx.fillRect(px+7,py+(ch==="C"?10:6),26,ch==="C"?8:6);ctx.fillStyle="#ffd166";ctx.fillRect(px+18,py+16,4,6);if(ch==="C"){ctx.fillStyle=`rgba(255,209,102,${.3+.3*Math.sin(t/10)})`;ctx.beginPath();ctx.arc(px+20,py+20,20,0,7);ctx.fill()}return}
 if(ch===">"){if(R.gateOpen){ctx.fillStyle=`rgba(47,212,122,${.4+.3*Math.sin(t/8)})`;ctx.fillRect(px,py,TILE,TILE);ctx.fillStyle="#fff";ctx.font="bold 22px Verdana";ctx.textAlign="center";ctx.fillText("➜",px+20,py+28)}else{ctx.fillStyle="#3a0d0d";ctx.fillRect(px,py,TILE,TILE);for(let i=0;i<4;i++){ctx.fillStyle=`rgba(255,60,60,${.5+.4*Math.sin(t/6+i)})`;ctx.fillRect(px+4+i*9,py,4,TILE)}ctx.font="16px Verdana";ctx.textAlign="center";ctx.fillText("🔒",px+20,py+26)}return}
}
function drawDeco(px,py,th){
 const c=th.decoC;
 if(th.deco==="spike"||th.deco==="obsidian"){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(px+8,py+38);ctx.lineTo(px+16,py+4);ctx.lineTo(px+24,py+38);ctx.fill();ctx.beginPath();ctx.moveTo(px+20,py+38);ctx.lineTo(px+28,py+14);ctx.lineTo(px+34,py+38);ctx.fill();if(th.deco==="obsidian"){ctx.fillStyle="#7a2cff";ctx.fillRect(px+15,py+12,2,14)}}
 else if(th.deco==="tree"||th.deco==="pine"){ctx.fillStyle="#5a3a1e";ctx.fillRect(px+17,py+26,6,12);ctx.fillStyle=c;if(th.deco==="pine"){ctx.beginPath();ctx.moveTo(px+6,py+30);ctx.lineTo(px+20,py+2);ctx.lineTo(px+34,py+30);ctx.fill()}else{ctx.beginPath();ctx.arc(px+20,py+18,14,0,7);ctx.fill()}}
 else if(th.deco==="palm"){ctx.strokeStyle="#7a5a2e";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(px+18,py+38);ctx.quadraticCurveTo(px+14,py+20,px+22,py+10);ctx.stroke();ctx.strokeStyle=c;ctx.lineWidth=5;ctx.beginPath();[[-14,4],[14,4],[-10,-8],[10,-8]].forEach(([a,b])=>{ctx.moveTo(px+22,py+10);ctx.quadraticCurveTo(px+22+a/2,py+10+b-6,px+22+a,py+10+b+6)});ctx.stroke()}
 else{ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(px+20,py+26,15,11,0,0,7);ctx.fill();ctx.fillStyle="rgba(255,255,255,.15)";ctx.beginPath();ctx.ellipse(px+15,py+22,6,4,0,0,7);ctx.fill()}
}
function drawPerson(x,y,c,dir,anim,isP){
 const leg=Math.sin(anim)*4;
 ctx.fillStyle="rgba(0,0,0,.3)";ctx.beginPath();ctx.ellipse(x,y+16,12,4,0,0,7);ctx.fill();
 ctx.fillStyle="#2a2a3a";ctx.fillRect(x-7,y+6+(isP?leg*.5:0),5,10);ctx.fillRect(x+2,y+6-(isP?leg*.5:0),5,10);
 ctx.fillStyle=c.coat;ctx.fillRect(x-10,y-8,20,17);ctx.fillStyle=c.shirt;ctx.fillRect(x-3,y-8,6,12);
 ctx.fillStyle=c.skin;ctx.beginPath();ctx.arc(x,y-15,8,0,7);ctx.fill();
 ctx.fillStyle=c.hair;ctx.fillRect(x-8,y-24,16,6);
 if(isP){ctx.fillStyle="#7a4a1e";ctx.fillRect(x-12,y-24,24,4);ctx.fillRect(x-7,y-30,14,7)}
 ctx.fillStyle="#111";ctx.fillRect(x-4+dir*2,y-16,2,3);ctx.fillRect(x+2+dir*2,y-16,2,3);
}
function drawEnemy(e,t){
 const b=Math.sin(e.ph)*3,x=e.x,y=e.y+b;
 ctx.fillStyle="rgba(0,0,0,.3)";ctx.beginPath();ctx.ellipse(e.x,e.y+15,13,4,0,0,7);ctx.fill();
 ctx.fillStyle=shade(e.color,-45);
 if(e.k%3===0){ctx.beginPath();ctx.moveTo(x-12,y-8);ctx.lineTo(x-6,y-22);ctx.lineTo(x,y-10);ctx.lineTo(x+6,y-22);ctx.lineTo(x+12,y-8);ctx.fill()}
 else if(e.k%3===1){ctx.fillRect(x-12,y-20,4,12);ctx.fillRect(x+8,y-20,4,12)}
 else{ctx.beginPath();ctx.arc(x-7,y-12,5,0,7);ctx.arc(x+7,y-13,5,0,7);ctx.fill()}
 ctx.fillStyle=e.color;ctx.beginPath();ctx.ellipse(x,y,15,13,0,0,7);ctx.fill();
 const ang=Math.atan2(P.y-e.y,P.x-e.x),ox=Math.cos(ang)*2,oy=Math.sin(ang)*2;
 ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(x-5,y-2,4,0,7);ctx.arc(x+5,y-2,4,0,7);ctx.fill();
 ctx.fillStyle="#111";ctx.beginPath();ctx.arc(x-5+ox,y-2+oy,2,0,7);ctx.arc(x+5+ox,y-2+oy,2,0,7);ctx.fill();
}
function drawBoss(t){
 const bo=R.boss,b=Math.sin(t/14)*4,x=bo.x,y=bo.y+b;
 const g=ctx.createRadialGradient(x,y,10,x,y,75);g.addColorStop(0,"rgba(160,170,255,.45)");g.addColorStop(1,"rgba(60,60,140,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,75,0,7);ctx.fill();
 if(Math.floor(t/6)%11===0){ctx.strokeStyle="#ffd166";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x-20,y+18);ctx.lineTo(x-28,y+36);ctx.lineTo(x-16,y+36);ctx.lineTo(x-24,y+56);ctx.stroke()}
 ctx.fillStyle="#4a4e69";ctx.beginPath();ctx.arc(x-18,y+4,18,0,7);ctx.arc(x+18,y+4,18,0,7);ctx.arc(x,y-8,22,0,7);ctx.arc(x-30,y+14,12,0,7);ctx.arc(x+30,y+14,12,0,7);ctx.fill();
 ctx.fillStyle="#ffd166";ctx.beginPath();ctx.moveTo(x-18,y-26);ctx.lineTo(x-14,y-44);ctx.lineTo(x-5,y-32);ctx.lineTo(x,y-48);ctx.lineTo(x+5,y-32);ctx.lineTo(x+14,y-44);ctx.lineTo(x+18,y-26);ctx.fill();
 ctx.fillStyle="#fff6a8";ctx.beginPath();ctx.arc(x-10,y-2,6,0,7);ctx.arc(x+10,y-2,6,0,7);ctx.fill();ctx.fillStyle="#111";ctx.beginPath();ctx.arc(x-9,y-1,3,0,7);ctx.arc(x+9,y-1,3,0,7);ctx.fill();
 ctx.fillStyle="#fff";ctx.font="bold 13px Verdana";ctx.textAlign="center";ctx.fillText("THE STORM TYRANT",x,y+52);
}
const PLAYER_C={coat:"#1f9e8f",shirt:"#ffd166",skin:"#e2a878",hair:"#4a2a12"};
function draw(){
 const t=frame,th=R?R.reg.theme:ROOMS[0].theme;
 ctx.clearRect(0,0,cv.width,cv.height);
 if(!R){ctx.fillStyle="#120b08";ctx.fillRect(0,0,cv.width,cv.height);return}
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)drawTile(R.grid[y][x],x,y,t,th);
 for(const e of R.enemies)drawEnemy(e,t);
 if(R.boss)drawBoss(t);
 if(!(S.inv>0&&Math.floor(t/4)%2))drawPerson(P.x,P.y,PLAYER_C,P.dir,P.anim,true);
 const vg=ctx.createRadialGradient(480,280,200,480,280,600);vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,"rgba(0,0,0,.45)");ctx.fillStyle=vg;ctx.fillRect(0,0,cv.width,cv.height);
}
let last=performance.now();
function loop(now){const dt=Math.min(3,(now-last)/16.67);last=now;update(dt);draw();requestAnimationFrame(loop)}

/* ================= TITLE ================= */
function title(){
 const sv=loadSave();
 showPanel(`<div class="center"><div class="logo">STORM QUEST</div><div class="subt">FURY OF THE STORM TYRANT</div><div class="teks">TEKS 8.10A · Sun, Water & Air · Weather & Climate · STAAR Review Adventure</div>
 <div class="row" style="justify-content:center;gap:4px">${ROOMS.slice(0,5).map(r=>crystalSVG(r.crystal,34)).join("")}</div>
 <p style="max-width:640px;margin:10px auto;font-size:17px">The <b>Storm Tyrant</b> has stolen the 5 Sky Crystals and is throwing Earth’s weather out of control! Explore 5 regions, learn from the scientists, run lab simulations, and battle monsters with <b>STAAR-level questions</b> to win back each crystal. Then face the Tyrant in the eye of his storm.</p>
 <div style="margin:12px 0"><input type="text" id="nm" maxlength="24" placeholder="Type your first & last name" value="${sv?esc(sv.name):""}"></div>
 <div class="row" style="justify-content:center"><button class="btn" id="st">▶ New Game</button>${sv?`<button class="btn alt" id="ct">⏩ Continue (Region ${sv.room+1})</button>`:""}</div>
 <div class="howto"><div><b>🕹️ Move:</b> Arrow keys / WASD (or on-screen arrows)</div><div><b>🧑‍🔬 Learn:</b> walk into guides & lab stations</div><div><b>👾 Battle:</b> walk into monsters, answer to attack</div><div><b>📝 Record:</b> write down each Mission Code</div></div></div>`,()=>{
  const go=cont=>{const n=$("#nm").value.trim();if(!n){$("#nm").focus();$("#nm").classList.add("shake");setTimeout(()=>$("#nm").classList.remove("shake"),400);return}
   S.name=n;sfx("gate");
   if(cont&&sv){Object.assign(S,{xp:sv.xp,lvl:sv.lvl,maxhp:sv.maxhp,hp:sv.maxhp,correct:sv.correct,attempts:sv.attempts,missed:sv.missed||[],codes:sv.codes||[],best:sv.best||0,elapsedBefore:sv.elapsed||0});S.start=Date.now();closePanel();loadRoom(sv.room)}
   else{S.start=Date.now();closePanel();loadRoom(0);setTimeout(()=>{if(!S.paused)openHelp()},300)}};
  $("#st").onclick=()=>go(false);if(sv)$("#ct").onclick=()=>go(true);
  $("#nm").addEventListener("keydown",e=>{if(e.key==="Enter")go(!!sv&&false)});
 });
}
updateHUD();requestAnimationFrame(loop);title();
</script>
