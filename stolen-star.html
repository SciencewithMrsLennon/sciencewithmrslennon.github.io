<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{box-sizing:border-box}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>The Stolen Star Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral+SC:wght@500;700&family=Lexend:wght@400;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: a suspect board pinned above one case-file card; each station clears a suspect until two remain for the interrogation. */
:root{
  --night:#EEF0F7; --card:#FFFFFF; --ink:#1A2042; --muted:#5A6187; --line:#D3D7E8;
  --star:#B97800; --star-ink:#FFFFFF; --giant:#B23A3A; --giant-bg:#F9E4E2;
  --clear:#2D7553; --clear-bg:#E1F1E8;
  --sky:#0E1330; --sky-line:#33406E; --sky-ink:#DCE2F7; --sky-muted:#8F99C2;
  --f-display:"Spectral SC", Georgia, "Times New Roman", serif;
  --f-body:"Lexend", "Segoe UI", system-ui, sans-serif;
  --f-mono:"Space Mono", "Courier New", monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --night:#0B0F26; --card:#161C3D; --ink:#E9E8F6; --muted:#A3A9CB; --line:#2C3563;
  --star:#F4BA45; --star-ink:#1A1530; --giant:#F08A80; --giant-bg:#42222A;
  --clear:#7FCFA2; --clear-bg:#1B3A2D;
  --sky:#070A1C; --sky-line:#2C3768; --sky-ink:#DCE2F7; --sky-muted:#8F99C2; color-scheme:dark}}
:root[data-theme="dark"]{
  --night:#0B0F26; --card:#161C3D; --ink:#E9E8F6; --muted:#A3A9CB; --line:#2C3563;
  --star:#F4BA45; --star-ink:#1A1530; --giant:#F08A80; --giant-bg:#42222A;
  --clear:#7FCFA2; --clear-bg:#1B3A2D;
  --sky:#070A1C; --sky-line:#2C3768; --sky-ink:#DCE2F7; --sky-muted:#8F99C2; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-size:1.7rem;line-height:1;font-weight:700}
.brand small{display:block;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:8px;font-weight:400}
.clock{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:.95rem}

.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:620px){.board{grid-template-columns:repeat(3,minmax(0,1fr))}}
.sus{position:relative;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0;overflow:hidden}
.sus .face{width:40px;height:40px;border-radius:50%;background:var(--sky);color:var(--star);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1rem}
.sus b{font-size:.74rem;line-height:1.2}
.sus span{font-size:.64rem;color:var(--muted);line-height:1.2}
.sus.out .face,.sus.out b,.sus.out span{opacity:.35}
.sus.out::after{content:"CLEARED";position:absolute;top:42%;left:50%;transform:translate(-50%,-50%) rotate(-14deg);font-family:var(--f-mono);font-weight:700;font-size:.72rem;letter-spacing:.12em;color:var(--clear);border:2px solid var(--clear);padding:2px 6px;border-radius:3px;background:var(--card);animation:stamp .35s ease-out}
.sus.guilty{border-color:var(--giant);box-shadow:0 0 0 2px var(--giant)}
.sus.guilty::after{content:"GUILTY";position:absolute;top:42%;left:50%;transform:translate(-50%,-50%) rotate(-14deg);font-family:var(--f-mono);font-weight:700;font-size:.72rem;letter-spacing:.12em;color:var(--giant);border:2px solid var(--giant);padding:2px 6px;border-radius:3px;background:var(--card);animation:stamp .35s ease-out}
@keyframes stamp{0%{transform:translate(-50%,-50%) scale(1.8) rotate(-24deg);opacity:0}100%{transform:translate(-50%,-50%) rotate(-14deg);opacity:1}}

.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:clamp(20px,4vw,36px);display:flex;flex-direction:column;gap:18px;min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--star);font-weight:700}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.12;margin:0;text-wrap:balance}
h1{font-size:clamp(2rem,6vw,3rem)}
h2{font-size:clamp(1.45rem,4vw,1.9rem)}
h3{font-size:1.15rem}
p{margin:0;max-width:65ch}
.story{font-family:var(--f-mono);font-size:.95rem;color:var(--muted);border-left:3px solid var(--star);padding-left:14px;max-width:65ch}
.prompt{font-size:1.12rem;font-weight:600;max-width:65ch}
.guide{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.term{border:1px solid var(--line);border-radius:4px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.term b{font-family:var(--f-display);font-size:1.05rem}
.term span{font-size:.88rem}
.fig{background:var(--sky);border-radius:6px;padding:12px;overflow-x:auto}
.fig svg{display:block;width:100%;max-width:520px;height:auto;margin:0 auto}
.opts{display:grid;gap:10px}
.opt{font:inherit;text-align:left;padding:12px 16px;border:1.5px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink);cursor:pointer;transition:border-color .15s, background .15s}
.opt:hover:not(:disabled){border-color:var(--star)}
.opt:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible,.chk:focus-within{outline:3px solid var(--star);outline-offset:2px}
.opt.wrong{border-color:var(--giant);background:var(--giant-bg);color:var(--giant)}
.opt.right{border-color:var(--clear);background:var(--clear-bg);color:var(--clear);font-weight:700}
.opt:disabled{cursor:default}
.fb{padding:12px 16px;border-radius:4px;font-size:.96rem;max-width:65ch}
.fb.no{background:var(--giant-bg);color:var(--giant)}
.fb.yes{background:var(--clear-bg);color:var(--clear)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{font:inherit;font-weight:700;padding:12px 22px;border-radius:4px;border:none;background:var(--star);color:var(--star-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
label{font-weight:600;font-size:.95rem}
input[type=text],textarea{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:4px;padding:10px 12px;width:100%;max-width:420px}
textarea{max-width:100%;min-height:150px;font-family:var(--f-mono);font-size:.95rem;line-height:1.6;resize:vertical}
.field{display:flex;flex-direction:column;gap:6px}
.qmeta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);font-family:var(--f-mono)}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.d{background:var(--star)}
.memo{background:var(--sky);color:var(--sky-ink);border-radius:6px;padding:20px 22px;display:flex;flex-direction:column;gap:10px;font-family:var(--f-mono);font-size:.95rem}
.memo .tag{color:var(--star);letter-spacing:.14em;font-size:.75rem;font-weight:700;text-transform:uppercase}
.alibis{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.alibi{border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.alibi q{font-family:var(--f-mono);font-size:.93rem;color:var(--muted);quotes:"\201C" "\201D"}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;border:1.5px solid var(--line);border-radius:4px;padding:10px 12px;cursor:pointer}
.chk input{margin-top:5px;accent-color:var(--star)}
.lineup{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.lineup div{display:flex;gap:10px;align-items:flex-start;min-width:0}
.lineup .face{flex:none;width:36px;height:36px;border-radius:50%;background:var(--sky);color:var(--star);display:grid;place-items:center;font-family:var(--f-display);font-weight:700}
.lineup p{font-size:.88rem}
.cert{border:2px solid var(--ink);outline:1px solid var(--ink);outline-offset:-8px;padding:clamp(24px,5vw,40px);display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.cert .name{font-family:var(--f-display);font-size:clamp(2rem,6vw,2.8rem);line-height:1.1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;width:100%}
.stat{border-top:1px solid var(--line);padding-top:8px}
.stat b{display:block;font-family:var(--f-mono);font-size:1.4rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.teacher{font-size:.9rem;color:var(--muted)}
.teacher summary{cursor:pointer;font-weight:700}
.teacher ul,.teacher ol{margin:8px 0 0;padding-left:20px}
.sky-hero{background:var(--sky);border-radius:6px;height:120px;position:relative;overflow:hidden}
.sky-hero canvas{width:100%;height:100%;display:block}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div class="brand">The Stolen Star Atlas<small>A Stars &amp; Galaxies Whodunit · Starfall Observatory</small></div>
    <div class="clock" id="clock" aria-live="off"></div>
  </header>
  <div class="board" id="board" aria-label="Suspect board"></div>
  <main class="card" id="app"></main>
</div>

<script>
const SUSPECTS = [
 {n:"Dr. Lyra Chen", r:"Head Astronomer", i:"LC"},
 {n:"Marcus Bell", r:"Night Custodian", i:"MB"},

 {n:"Nova Ruiz", r:"Student Intern", i:"NR"},
 {n:"Felix Grant", r:"Gift Shop Manager", i:"FG"},
 {n:"Dr. Ada Okafor", r:"Telescope Engineer", i:"AO"}
];
const CULPRIT = 2;

const HR_SVG = `<svg viewBox="0 0 380 280" role="img" aria-label="H-R diagram with stars A through E">
 <rect x="0" y="0" width="380" height="280" fill="none"/>

 <line x1="56" y1="230" x2="360" y2="230" stroke="var(--sky-line)" stroke-width="2"/>
 <path d="M70 40 C 150 90, 230 150, 345 212" stroke="var(--sky-line)" stroke-width="26" fill="none" stroke-linecap="round" opacity=".7"/>
 <text x="150" y="128" fill="var(--sky-muted)" font-size="11" font-family="Space Mono, monospace" transform="rotate(33 150 128)">main sequence</text>

 <circle cx="84" cy="48" r="11" fill="#86B6FF"/><text x="100" y="53" fill="var(--sky-ink)" font-size="15" font-weight="700" font-family="Lexend, sans-serif">A</text>

 <circle cx="312" cy="62" r="17" fill="#E8644A"/><text x="282" y="68" fill="var(--sky-ink)" font-size="15" font-weight="700" font-family="Lexend, sans-serif">C</text>
 <circle cx="104" cy="200" r="4" fill="#EEF1FA"/><text x="114" y="196" fill="var(--sky-ink)" font-size="15" font-weight="700" font-family="Lexend, sans-serif">D</text>
 <text x="22" y="200" fill="var(--sky-ink)" font-size="11" font-family="Lexend, sans-serif" transform="rotate(-90 22 200)">dim  ←  Luminosity  →  bright</text>

 <text x="170" y="252" fill="var(--sky-ink)" font-size="11" font-family="Lexend, sans-serif">Temperature</text>

</svg>`;

function galaxySVG(kind, label){
  let g = "";
  if(kind==="spiral"){
    g = `<g transform="translate(180 110)">
      <path d="M0 0 C 30 -10, 60 10, 70 40 C 80 70, 40 95, -10 90" stroke="#B9C8FF" stroke-width="10" fill="none" stroke-linecap="round" opacity=".75"/>

      <circle r="20" fill="#FFE9A8"/><circle r="10" fill="#FFF7DD"/>
      <circle cx="55" cy="60" r="3" fill="#9CC0FF"/><circle cx="-58" cy="-62" r="3" fill="#9CC0FF"/><circle cx="20" cy="85" r="2.5" fill="#9CC0FF"/><circle cx="-25" cy="-85" r="2.5" fill="#9CC0FF"/></g>`;
  } else if(kind==="elliptical"){
    g = `<defs><radialGradient id="eg" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFF1CF"/><stop offset=".45" stop-color="#F2B97A" stop-opacity=".85"/><stop offset="1" stop-color="#C0704A" stop-opacity="0"/></radialGradient></defs>
      <ellipse cx="180" cy="110" rx="110" ry="70" fill="url(#eg)"/>`;
  } else {
    g = `<g fill="#A9C2FF">
      <ellipse cx="140" cy="90" rx="38" ry="22" opacity=".55" transform="rotate(-25 140 90)"/>
      <ellipse cx="205" cy="125" rx="46" ry="18" opacity=".45" transform="rotate(18 205 125)"/>
      <ellipse cx="175" cy="70" rx="20" ry="14" opacity=".5"/>
      <circle cx="120" cy="130" r="12" opacity=".5"/>
      <circle cx="160" cy="105" r="4" fill="#E8F0FF"/><circle cx="214" cy="118" r="3" fill="#E8F0FF"/><circle cx="132" cy="84" r="3" fill="#E8F0FF"/><circle cx="240" cy="140" r="2.5" fill="#E8F0FF"/><circle cx="105" cy="128" r="2.5" fill="#E8F0FF"/></g>`;
  }
  return `<svg viewBox="0 0 360 220" role="img" aria-label="${label}"><rect width="360" height="220" fill="none"/>${g}
   <text x="14" y="206" fill="var(--sky-muted)" font-size="12" font-family="Space Mono, monospace">${label}</text></svg>`;
}

const MW_SVG = `<svg viewBox="0 0 360 220" role="img" aria-label="Milky Way seen from above with points X, Y and Z">

  <path d="M-40 14 C -90 10, -120 -30, -90 -70 C -60 -100, 0 -100, 40 -80" stroke="#B9C8FF" stroke-width="12" fill="none" stroke-linecap="round" opacity=".6"/>
  <path d="M10 -40 C 60 -50, 110 -30, 125 0" stroke="#B9C8FF" stroke-width="7" fill="none" stroke-linecap="round" opacity=".45"/>
  <circle cx="0" cy="0" r="5" fill="#FFF7DD"/><text x="8" y="-6" fill="var(--sky-ink)" font-size="15" font-weight="700" font-family="Lexend, sans-serif">X</text>
  <circle cx="72" cy="78" r="5" fill="#FFD25A"/><text x="80" y="92" fill="var(--sky-ink)" font-size="15" font-weight="700" font-family="Lexend, sans-serif">Y</text>
  <circle cx="160" cy="-70" r="5" fill="#E8F0FF"/><text x="146" y="-78" fill="var(--sky-ink)" font-size="15" font-weight="700" font-family="Lexend, sans-serif">Z</text>
 </g>
 <text x="14" y="210" fill="var(--sky-muted)" font-size="12" font-family="Space Mono, monospace">Milky Way, top view</text></svg>`;

const STATIONS = [
{ title:"The Star Nursery", skill:"Life Cycle of Stars", teks:"TEKS 8.9A",
  story:"The first clue is locked in the observatory's planetarium. The lock opens only for detectives who can trace a star from birth to death.",
  guide:[["Nebula","A giant cloud of gas and dust where stars are born."],["Main sequence","The long, stable stage when a star fuses hydrogen into helium."],["Red giant / supergiant","The swollen, cooler stage after a star runs low on hydrogen."],["White dwarf, neutron star, black hole","The leftover cores at the end of a star's life."]],
  qs:[
   {prompt:"Every star begins its life inside a…", options:["Black hole","Nebula","White dwarf","Supernova"], answer:1,
    hint:"Think of a cloud.", explain:"Stars form inside nebulae, huge clouds of gas and dust."},
   {prompt:"What pulls the gas and dust of a nebula together to form a new star?", options:["Magnetism","Wind","Gravity","Light"], answer:2,
    hint:"It's the same force that keeps you on the ground.", explain:"Gravity pulls the material inward until the core is hot enough for fusion."},
   {prompt:"What decides which path a star follows through its life?", options:["Its color when it is born","Its distance from Earth","Its mass","The galaxy it is in"], answer:2,
    hint:"Big stars and small stars end very differently.", explain:"A star's mass decides how long it lives and how it dies."},
   {prompt:"During the main sequence stage, what happens in a star's core?", options:["Hydrogen fuses into helium","Helium splits into hydrogen","The core cools and freezes","Gas escapes into a nebula"], answer:0,
    hint:"Fusion joins small atoms into bigger ones.", explain:"Main sequence stars fuse hydrogen into helium, which releases huge amounts of energy."},
   {prompt:"Which life path belongs to a star like our Sun?", options:["Nebula → main sequence → red supergiant → supernova → black hole","Nebula → main sequence → red giant → planetary nebula → white dwarf","Nebula → white dwarf → red giant → main sequence","Nebula → supernova → main sequence → neutron star"], answer:1,
    hint:"The Sun is an average-mass star. It will not explode.", explain:"Average stars swell into red giants, shed their outer layers, and leave a white dwarf."},
   {prompt:"A massive blue star and a small red dwarf form at the same time. Which one will live longer?", options:["The massive blue star, because it has more fuel","The small red dwarf, because it uses its fuel slowly","They will live exactly as long","Neither, stars do not die"], answer:1,
    hint:"A bonfire has more wood than a candle, but which burns out first?", explain:"Massive stars burn through their fuel quickly. Small red dwarfs can shine for trillions of years."}
  ],
  evidence:{clears:1, title:"Evidence #1: Lobby Camera",
    text:"The vault keypad log shows the code was entered at 2:14 AM. The lobby camera shows Marcus Bell mopping the front entrance from 2:05 to 2:30 AM, nowhere near the vault."}},

{ title:"The Diagram Room", skill:"The H-R Diagram", teks:"TEKS 8.9A",
  story:"The thief left a smudged H-R diagram taped to the vault door. Read it correctly to reveal what is written underneath.",
  guide:[["Luminosity","How bright a star really is. Brighter stars are higher on the diagram."],["Temperature","Hot stars are on the left (blue). Cool stars are on the right (red)."],["Size clue","A cool star that is very bright must be huge. A hot star that is dim must be tiny."],["Main sequence","The diagonal band where about 90% of stars, including the Sun, are found."]],
  qs:[
   {fig:"hr", prompt:"Which star is the hottest AND brightest?", options:["A","B","C","D"], answer:0,
    hint:"Hot is on the left. Bright is at the top.", explain:"Star A is in the upper left: very hot and very luminous, a blue main sequence star."},
   {fig:"hr", prompt:"Which star is a white dwarf?", options:["A","C","D","E"], answer:2,
    hint:"White dwarfs are hot but very dim.", explain:"Star D is on the hot left side but near the bottom, so it is small and dim: a white dwarf."},
   {fig:"hr", prompt:"Which star is a red supergiant?", options:["B","C","D","E"], answer:1,
    hint:"Cool (red) but very bright.", explain:"Star C is cool and red but at the very top, so it must be enormous: a red supergiant."},
   {fig:"hr", prompt:"Star E is a lot like our Sun. Which group is it in?", options:["White dwarfs","Supergiants","Main sequence","Giants"], answer:2,
    hint:"It sits on the diagonal band.", explain:"Star E sits in the middle of the main sequence, just like the Sun."},
   {fig:"hr", prompt:"Stars B and C are about the same temperature. Why is star C so much brighter?", options:["Star C is closer to Earth","Star C is much larger","Star C is hotter","Star C is younger"], answer:1,
    hint:"Same temperature means each patch of surface gives off about the same light.", explain:"Same temperature, much brighter: star C has far more surface area, so it is much bigger."},
   {fig:"hr", prompt:"Moving from left to right across an H-R diagram, temperature…", options:["Increases","Decreases","Stays the same","Increases, then decreases"], answer:1,
    hint:"Look at where blue and red stars are.", explain:"The left side is hot and blue, and the right side is cool and red. Temperature decreases left to right."}
  ],
  evidence:{clears:4, title:"Evidence #2: Dome Grease",
    text:"The thief's glove left a smear of red telescope grease on the vault handle. That grease is only used inside the telescope dome. Felix Grant's key card has never opened the dome, and his card shows him locking the gift shop at 2:10 AM."}},

{ title:"The Galaxy Gallery", skill:"Types of Galaxies", teks:"TEKS 8.9B",
  story:"Three galaxy photographs were knocked off the gallery wall during the theft. Sort them and the next clue falls out of the frame.",
  guide:[["Spiral","A bright center bulge with arms that wind outward. Lots of gas, dust, and young blue stars in the arms."],["Elliptical","A smooth oval or round shape. Mostly old reddish stars and very little gas or dust."],["Irregular","No clear shape. Often has lots of gas and dust and active star formation."],["Galaxy","Billions of stars, gas, and dust held together by gravity."]],
  qs:[
   {fig:"g-spiral", prompt:"What type of galaxy is shown in Photo 1?", options:["Elliptical","Irregular","Spiral"], answer:2,
    hint:"Look for arms.", explain:"A central bulge with arms winding outward means a spiral galaxy."},
   {fig:"g-elliptical", prompt:"What type of galaxy is shown in Photo 2?", options:["Elliptical","Spiral","Irregular"], answer:0,
    hint:"Smooth oval, no arms.", explain:"A smooth, featureless oval glow is an elliptical galaxy."},
   {fig:"g-irregular", prompt:"What type of galaxy is shown in Photo 3?", options:["Spiral","Irregular","Elliptical"], answer:1,
    hint:"Does it have any clear shape?", explain:"Patchy clumps with no clear shape make this an irregular galaxy."},
   {prompt:"A galaxy is a smooth oval with mostly old, reddish stars and almost no gas or dust. What type is it?", options:["Spiral","Irregular","Elliptical"], answer:2,
    hint:"Little gas means few new stars, and no arms.", explain:"Old stars, little gas, smooth oval shape: elliptical."},
   {prompt:"A galaxy has a bright center and arms full of gas, dust, and young blue stars. What type is it?", options:["Elliptical","Spiral","Irregular"], answer:1,
    hint:"Where do young stars line up?", explain:"Young blue stars forming along arms is the mark of a spiral galaxy."},
   {prompt:"What is a galaxy made of?", options:["One star and its planets","Billions of stars, gas, and dust held together by gravity","Only gas and dust","A group of nearby planets"], answer:1,
    hint:"One star with planets is a solar system. A galaxy is much bigger.", explain:"A galaxy holds billions of stars plus gas and dust, all bound by gravity."}
  ],
  evidence:{clears:3, title:"Evidence #3: The Livestream",
    text:"Nova Ruiz was hosting the observatory's live telescope stream from 2:00 to 2:30 AM. More than 300 viewers watched her answer questions on camera the entire time."}},

{ title:"The Map Room", skill:"Our Place in the Milky Way", teks:"TEKS 8.9B",
  story:"The final clue is hidden on the observatory's giant wall map of our home galaxy. Find where we are, and the map points to the next suspect cleared.",
  guide:[["Milky Way","Our home galaxy, a barred spiral galaxy."],["Orion Arm","The spiral arm our solar system sits in, about two-thirds of the way out from the center."],["Galactic center","A crowded bulge with a supermassive black hole at the middle."],["Scale","Planet → solar system → galaxy → universe."]],
  qs:[
   {prompt:"What type of galaxy is the Milky Way?", options:["Elliptical","Irregular","Spiral"], answer:2,
    hint:"It has arms.", explain:"The Milky Way is a (barred) spiral galaxy."},
   {fig:"mw", prompt:"Which point on the map shows about where our solar system is?", options:["X, the center","Y, out in a spiral arm","Z, outside the galaxy"], answer:1,
    hint:"We are not in the center, and we are inside the galaxy.", explain:"Our solar system is in the Orion Arm, about two-thirds of the way from the center to the edge."},
   {prompt:"What is found at the very center of the Milky Way?", options:["Our Sun","A supermassive black hole","An empty space","The Andromeda galaxy"], answer:1,
    hint:"Something with enormous gravity.", explain:"A supermassive black hole sits at the center of the Milky Way."},
   {prompt:"Which list goes from smallest to largest?", options:["Galaxy → solar system → planet → universe","Planet → solar system → galaxy → universe","Solar system → planet → universe → galaxy","Universe → galaxy → solar system → planet"], answer:1,
    hint:"Planets are inside solar systems. Solar systems are inside galaxies.", explain:"Planet → solar system → galaxy → universe."},
   {prompt:"Andromeda, the nearest large galaxy to us, is what type?", options:["Spiral","Elliptical","Irregular"], answer:0,
    hint:"It looks a lot like the Milky Way.", explain:"Andromeda is a large spiral galaxy, much like the Milky Way."},
   {prompt:"On a dark night, the Milky Way looks like a hazy band across the sky. Why?", options:["We see it from outside the galaxy","We are inside its flat disk, looking along it","It is a cloud in Earth's atmosphere","It is light reflected off the Moon"], answer:1,
    hint:"Imagine standing inside a frisbee and looking toward its edge.", explain:"We live inside the flat disk, so looking along it we see millions of stars blur into a band."}
  ],
  evidence:{clears:5, title:"Evidence #4: Flight Record",
    text:"Dr. Ada Okafor's flight home from a telescope conference didn't land until 4:05 AM. The airline confirmed she was in the air at 2:14 AM."}}
];

const ALIBIS = {
 0: "At 2:14 AM I was in the control room logging Betelgeuse. It's a red supergiant, cool and red but incredibly bright, so it sits in the upper right of the H-R diagram. It's so massive that one day it will explode as a supernova.",
 2: "At 2:14 AM I was in the library sketching the Andromeda galaxy for my research. Andromeda is the nearest large galaxy to the Milky Way. It's an irregular galaxy with no real shape, just like the Milky Way. And of course our Sun sits right in the center of the Milky Way."
};
const CLAIMS = [
 {t:"Andromeda is the nearest large galaxy to the Milky Way.", lie:false},
 {t:"Andromeda is an irregular galaxy with no real shape.", lie:true},
 {t:"The Milky Way is an irregular galaxy.", lie:true},
 {t:"Our Sun sits right in the center of the Milky Way.", lie:true}
];

let S;
function fresh(){ return {screen:"intro", name:"", si:0, qi:0, misses:0, tries:0, solved:false, start:null, end:null, cleared:[], picked:[], accuseMiss:0, step:0, wrongAccuse:false, claimMsg:"", cer:""}; }
S = (window.claude?.hot?.data?.S) || fresh();
window.claude?.hot?.snapshot?.(()=>({S}));

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function fmt(ms){ const t=Math.max(0,Math.floor(ms/1000)); return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0"); }
setInterval(()=>{ const el=$("#clock"); if(!el) return; if(!S.start){ el.textContent="Target: 45 min"; return;} el.textContent="Case time "+fmt((S.end||Date.now())-S.start); },1000);

function board(){
  $("#board").innerHTML = SUSPECTS.map((p,k)=>{
    const cls = S.cleared.includes(k) ? "out" : (S.screen==="done" && k===CULPRIT ? "guilty" : "");
    return `<div class="sus ${cls}"><div class="face">${p.i}</div><b>${p.n}</b><span>${p.r}</span></div>`;
  }).join("");
}

function figHTML(f){
  if(!f) return "";
  let svg = f==="hr" ? HR_SVG : f==="mw" ? MW_SVG :
    galaxySVG(f.slice(2), f==="g-spiral"?"Photo 1":f==="g-elliptical"?"Photo 2":"Photo 3");
  return `<div class="fig">${svg}</div>`;
}

function render(){
  board();
  const app = $("#app");
  if(S.screen==="intro") return intro(app);
  if(S.screen==="station") return station(app);
  if(S.screen==="evidence") return evidence(app);
  if(S.screen==="final") return finale(app);
  if(S.screen==="done") return done(app);
}

function intro(app){
  app.innerHTML = `
   <div class="sky-hero"><canvas id="sky" aria-hidden="true"></canvas></div>
   <div class="eyebrow">Case file 8.9 · Opened 2:14 AM</div>
   <h1>Who stole the Star Atlas?</h1>
   <p class="story">Last night, someone broke into the vault at Starfall Observatory and stole the Star Atlas, a one-of-a-kind map of 10,000 stars and galaxies. Six people were in the building. You have four rooms to search. Each room you solve produces evidence that clears one suspect. Then you'll interrogate the last two and name the thief.</p>
   <div class="lineup">${SUSPECTS.map(p=>`<div><span class="face">${p.i}</span><p><b>${p.n}</b><br>${p.r}</p></div>`).join("")}</div>
   <div class="field"><label for="dname">Detective name</label><input type="text" id="dname" maxlength="40" value="${esc(S.name)}" placeholder="First and last name" autocomplete="off"></div>
   <div class="row"><button class="btn" id="go">Open the case</button></div>
   <details class="teacher"><summary>Teacher notes and answer key</summary>
    <ul>
     <li><b>Standards:</b> TEKS 8.9A (star life cycle, H-R diagram) and 8.9B (galaxy types, our place in the Milky Way).</li>
     <li><b>Time:</b> about 45 minutes. 24 station questions, 4 evidence reveals, and a final interrogation with a written explanation.</li>
     <li><b>How it works:</b> Students must answer each question correctly to move on. A hint appears after a wrong answer, and an explanation appears after a correct one. Misses are counted on the final certificate.</li>
     <li><b>Order of suspects cleared:</b> Marcus Bell, Felix Grant, Nova Ruiz, Dr. Ada Okafor.</li>
     <li><b>Culprit:</b> Prof. Hal Stone. His alibi has three science errors: Andromeda is a spiral (not irregular), the Milky Way is a spiral (not irregular), and the Sun is in the Orion Arm (not the center). Dr. Chen's alibi about Betelgeuse is scientifically correct.</li>
     <li><b>Station answers:</b> 1) Nebula, Gravity, Mass, H→He fusion, red giant → white dwarf path, red dwarf. 2) A, D, C, Main sequence, C is larger, Decreases. 3) Spiral, Elliptical, Irregular, Elliptical, Spiral, billions of stars/gas/dust. 4) Spiral, Y, supermassive black hole, planet → solar system → galaxy → universe, Spiral, inside the disk.</li>
     <li><b>Exit evidence:</b> Have students screenshot the certificate, which shows their name, time, misses, and written explanation.</li>
    </ul></details>`;
  drawSky();
  $("#go").onclick = ()=>{
    const v = $("#dname").value.trim();
    if(!v){ $("#dname").focus(); $("#dname").placeholder="Enter your name to start"; return; }
    S.name=v; S.start=Date.now(); S.screen="station"; S.si=0; S.qi=0; S.tries=0; S.solved=false; render();
  };
}

function drawSky(){
  const c = $("#sky"); if(!c) return;
  const r = c.getBoundingClientRect(), d = window.devicePixelRatio||1;
  c.width = r.width*d; c.height = r.height*d;
  const x = c.getContext("2d"); x.scale(d,d);
  let seed = 7; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  for(let k=0;k<220;k++){
    const px=rnd()*r.width, py=rnd()*r.height, s=rnd()*1.4+.2;
    x.fillStyle = `rgba(${rnd()>.85?"255,210,140":rnd()>.7?"170,200,255":"235,238,255"},${.35+rnd()*.6})`;
    x.beginPath(); x.arc(px,py,s,0,Math.PI*2); x.fill();
  }
  const g = x.createRadialGradient(r.width*.78,r.height*.5,0,r.width*.78,r.height*.5,70);
  g.addColorStop(0,"rgba(255,220,150,.45)"); g.addColorStop(1,"rgba(255,220,150,0)");
  x.fillStyle=g; x.fillRect(0,0,r.width,r.height);
}

function station(app){
  const st = STATIONS[S.si], q = st.qs[S.qi];
  app.innerHTML = `
   <div class="eyebrow">Room ${S.si+1} of 4 · ${st.teks}</div>
   <h2>${st.title}</h2>
   ${S.qi===0 && !S.solved && S.tries===0 ? `<p class="story">${st.story}</p>
     <div class="guide">${st.guide.map(g=>`<div class="term"><b>${g[0]}</b><span>${g[1]}</span></div>`).join("")}</div>` : ""}
   <div class="qmeta"><span>${st.skill}</span><span class="dots">${st.qs.map((_,k)=>`<i class="${k<S.qi||(k===S.qi&&S.solved)?"d":""}"></i>`).join("")}</span></div>
   ${figHTML(q.fig)}
   <p class="prompt">${q.prompt}</p>
   <div class="opts" id="opts">${q.options.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div>
   <div id="fb"></div>
   <div class="row" id="nextrow" hidden><button class="btn" id="next">${S.qi===st.qs.length-1?"Reveal the evidence":"Next question"}</button></div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k;
    if(k===q.answer){
      S.solved=true;
      b.classList.add("right");
      app.querySelectorAll(".opt").forEach(x=>x.disabled=true);
      $("#fb").innerHTML=`<div class="fb yes"><b>Correct.</b> ${q.explain}</div>`;
      $("#nextrow").hidden=false; $("#next").focus();
      app.querySelectorAll(".dots i")[S.qi].classList.add("d");
    } else {
      S.misses++; S.tries++;
      b.classList.add("wrong"); b.disabled=true;
      $("#fb").innerHTML=`<div class="fb no"><b>Not that one.</b> Hint: ${q.hint}</div>`;
    }
  });
  $("#next").onclick=()=>{
    S.solved=false; S.tries=0;
    if(S.qi<st.qs.length-1){ S.qi++; } else { S.screen="evidence"; S.cleared.push(st.evidence.clears); }
    render(); window.scrollTo({top:0,behavior:"smooth"});
  };
}

function evidence(app){
  const st = STATIONS[S.si], ev = st.evidence, who = SUSPECTS[ev.clears];
  const left = SUSPECTS.length - S.cleared.length;
  app.innerHTML = `
   <div class="eyebrow">Room ${S.si+1} solved</div>
   <h2>${ev.title}</h2>
   <div class="memo"><span class="tag">Evidence report</span><p>${ev.text}</p></div>
   <p><b>${who.n}</b> is cleared. ${left} suspects remain.</p>
   <div class="row"><button class="btn" id="cont">${S.si<STATIONS.length-1?"Search the next room":"Interrogate the last two suspects"}</button></div>`;
  $("#cont").onclick=()=>{
    if(S.si<STATIONS.length-1){ S.si++; S.qi=0; S.screen="station"; } else { S.screen="final"; S.step=0; }
    render(); window.scrollTo({top:0,behavior:"smooth"});
  };
  $("#cont").focus();
}

function finale(app){
  const remaining = SUSPECTS.map((p,k)=>k).filter(k=>!S.cleared.includes(k));
  if(S.step===0){
    app.innerHTML = `
     <div class="eyebrow">Interrogation room</div>
     <h2>Two suspects. One is lying.</h2>
     <p class="story">Both suspects were inside the observatory at 2:14 AM, and both gave you an alibi. A real scientist wouldn't get the science wrong. Read each statement carefully, then accuse the person whose story doesn't hold up.</p>
     <div class="alibis">${remaining.map(k=>`<div class="alibi"><h3>${SUSPECTS[k].n}</h3><span class="teacher">${SUSPECTS[k].r}</span><q>${ALIBIS[k]}</q><button class="btn ghost" data-k="${k}">Accuse ${SUSPECTS[k].n.split(" ").slice(-1)[0]}</button></div>`).join("")}</div>
     <div id="fb">${S.wrongAccuse?`<div class="fb no"><b>Dr. Chen's science checks out.</b> Betelgeuse really is a cool, bright red supergiant in the upper right of the H-R diagram, and it really will end as a supernova. Read the other alibi again.</div>`:""}</div>`;
    app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k;
      if(k===CULPRIT){ S.step=1; S.wrongAccuse=false; render(); }
      else { S.accuseMiss++; S.misses++; S.wrongAccuse=true; render(); }
    });
    return;
  }
  if(S.step===1){
    app.innerHTML = `
     <div class="eyebrow">Interrogation room · Step 2 of 3</div>
     <h2>Prove Professor Stone lied.</h2>
     <p class="story">Stone says he is a galaxy expert, but his alibi contains mistakes no galaxy expert would make. Check every statement that is scientifically false.</p>
     <div class="opts">${CLAIMS.map((c,k)=>`<label class="chk"><input type="checkbox" id="c${k}" ${S.picked.includes(k)?"checked":""}><span>${c.t}</span></label>`).join("")}</div>
     <div id="fb">${S.claimMsg}</div>
     <div class="row"><button class="btn" id="check">Check my evidence</button></div>`;
    $("#check").onclick=()=>{
      S.picked = CLAIMS.map((_,k)=>k).filter(k=>$("#c"+k).checked);
      const right = CLAIMS.every((c,k)=>c.lie===S.picked.includes(k));
      if(right){ S.step=2; S.claimMsg=""; render(); }
      else {
        S.misses++;
        const missed = CLAIMS.filter((c,k)=>c.lie && !S.picked.includes(k)).length;
        const extra = CLAIMS.filter((c,k)=>!c.lie && S.picked.includes(k)).length;
        S.claimMsg = `<div class="fb no"><b>Not quite.</b> ${missed?`You missed ${missed} false statement${missed>1?"s":""}. `:""}${extra?`One statement you checked is actually true. `:""}Think about galaxy shapes and where our solar system really is.</div>`;
        render();
      }
    };
    return;
  }
  app.innerHTML = `
   <div class="eyebrow">Interrogation room · Step 3 of 3</div>
   <h2>Write your case report.</h2>
   <p>Explain to the observatory director why Professor Stone is the thief. Use evidence from his alibi and correct each science mistake.</p>
   <div class="memo"><span class="tag">Sentence starters</span><p>Professor Stone is the thief because… He claimed that… but actually… This proves he was not really studying Andromeda because…</p></div>
   <div class="field"><label for="cer">Case report</label><textarea id="cer" placeholder="Write at least three sentences.">${esc(S.cer)}</textarea></div>
   <p class="teacher" id="cnt"></p>
   <div class="row"><button class="btn" id="close" disabled>Close the case</button></div>`;
  const ta=$("#cer"), btn=$("#close"), cnt=$("#cnt");
  const upd=()=>{ S.cer=ta.value; const n=ta.value.trim().split(/\s+/).filter(Boolean).length; cnt.textContent = n+" words · 30 needed"; btn.disabled = n<30; };
  ta.oninput=upd; upd();
  btn.onclick=()=>{ S.end=Date.now(); S.screen="done"; render(); window.scrollTo({top:0,behavior:"smooth"}); };
}

function done(app){
  app.innerHTML = `
   <div class="eyebrow">Case closed</div>
   <h2>Professor Hal Stone stole the Star Atlas.</h2>
   <p class="story">Stone hoped to sell the Atlas to a private collector. He never went near the library. He slipped into the telescope dome, picked up grease on his glove, and opened the vault at 2:14 AM. His made-up alibi fell apart because he didn't know that Andromeda and the Milky Way are both spiral galaxies, or that our Sun sits in the Orion Arm, far from the galaxy's center.</p>
   <div class="cert">
    <span class="eyebrow">Starfall Observatory · Certificate of Detection</span>
    <div class="name">${esc(S.name)}</div>
    <p>solved the case of the Stolen Star Atlas using the life cycle of stars, the H-R diagram, and galaxy classification.</p>
    <div class="stats">
     <div class="stat"><b>${fmt(S.end-S.start)}</b><span>Case time</span></div>
     <div class="stat"><b>${S.misses}</b><span>Misses</span></div>
     <div class="stat"><b>24 + 3</b><span>Clues solved</span></div>
    </div>
    <div class="field" style="width:100%"><span class="eyebrow">Case report</span><p style="font-family:var(--f-mono);font-size:.92rem;white-space:pre-wrap">${esc(S.cer)}</p></div>
   </div>
   <p class="teacher">Take a screenshot of this certificate and turn it in to your teacher.</p>
   <div class="row"><button class="btn ghost" id="again">Start a new case</button></div>`;
  $("#again").onclick=()=>{ S=fresh(); render(); };
}

render();
</script>
</body></html>
